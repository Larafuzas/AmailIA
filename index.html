<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AmailIA - Ruta en Vivo</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121824;
            --bg-card: #1c2333;
            --bg-input: #252d3f;
            --accent-orange: #f59e0b;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Previene saltos con las barras dinámicas de iOS/Safari */
        }

        /* Contenedor Adaptativo Móvil */
        .phone-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            height: 100dvh; 
            background-color: var(--bg-main);
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 400px) {
            .phone-container {
                height: 844px;
                border-radius: 32px;
                border: 8px solid #000;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            }
        }

        /* Layout con división lateral para el Mapa */
        .main-layout {
            flex: 1;
            display: flex;
            position: relative;
            height: 100%;
        }

        .control-panel {
            width: 85%;
            height: 100%;
            background-color: var(--bg-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 2;
            box-shadow: 10px 0 20px rgba(0,0,0,0.4);
            overflow-y: auto;
        }

        .map-sidebar {
            width: 15%;
            height: 100%;
            background: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 0);
            background-size: 8px 8px;
            position: relative;
        }

        /* Cabecera */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .app-title-block h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-title-block span {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .close-icon {
            color: var(--text-secondary);
            cursor: pointer;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* Selector de municipios */
        .terminos-container {
            display: flex;
            background-color: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        .termino-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .termino-btn.active {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-action-orange {
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .input-field {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            width: 100%;
            -webkit-appearance: none;
        }
        .input-field::placeholder {
            color: #57657a;
        }

        /* Fix Selectores iOS nativos */
        select.input-field {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }

        .row-inputs {
            display: flex;
            gap: 12px;
        }

        .btn-insertar {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Bloque Orden de Reparto */
        .reparto-diario-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 120px;
        }

        .tramos-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .tramo-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .tramo-item span.remove {
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            padding: 0 4px;
        }

        .no-tramos-msg {
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
        }

        .btn-finalizar {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
            margin-bottom: 4px;
        }

        /* Botones flotantes laterales */
        .map-controls {
            position: absolute;
            bottom: 24px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
        }
        .map-btn {
            width: 40px;
            height: 40px;
            background-color: var(--bg-card);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        /* Panel de Ajustes Desplegable */
        .ajustes-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background-color: var(--bg-card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 35px rgba(0,0,0,0.6);
            z-index: 10;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 1px solid var(--border-color);
        }

        .ajustes-panel.open {
            transform: translateY(0);
        }

        .ajustes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ajustes-header h2 { font-size: 20px; font-weight: 700; }

        .ajustes-row {
            background-color: var(--bg-main);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        /* Tarjeta Estado Descarga */
        .status-box-download {
            background-color: var(--bg-main);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s ease;
        }

        .status-box-header { display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .status-badge::before { content: ''; display: inline-block; width: 8px; height: 8px; background-color: currentColor; border-radius: 50%; }
        
        .size-badge {
            background-color: #064e3b;
            color: var(--accent-green);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            font-weight: 700;
        }

        .status-box-body { font-size: 13px; color: var(--text-secondary); }
        .status-box-body strong { color: var(--text-primary); }

        .ajustes-actions-row { display: flex; gap: 12px; }
        .btn-ajuste { flex: 1; padding: 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
        .btn-ajuste-primary { background-color: var(--accent-blue); color: white; }
        .btn-ajuste-danger { background-color: #521b1b; color: #f87171; }
        
        .btn-ota { 
            background-color: var(--bg-main); 
            color: var(--text-secondary); 
            border: 1px solid var(--border-color); 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 12px; 
            cursor: pointer; 
            margin-top: auto; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="main-layout">
        
        <div class="control-panel">
            <div class="app-header">
                <div class="app-title-block">
                    <h1>AmailIA</h1>
                    <span>Ruta en Vivo</span>
                </div>
                <span class="material-icons close-icon">close</span>
            </div>

            <div>
                <p class="section-label">Término de Trabajo</p>
                <div class="terminos-container">
                    <button class="termino-btn active" onclick="cambiarTerminoDeTrabajo('Catarroja')">Catarroja</button>
                    <button class="termino-btn" onclick="cambiarTerminoDeTrabajo('Albal')">Albal</button>
                    <button class="termino-btn" onclick="cambiarTerminoDeTrabajo('Massanassa')">Massanassa</button>
                </div>
            </div>

            <button class="btn-action-orange">
                <span class="material-icons" style="font-size: 18px;">location_on</span>
                Marcar posición exacta con el dedo
            </button>

            <div class="form-group">
                <p class="section-label">Calle</p>
                <input type="text" class="input-field" id="input-busqueda-vias" list="lista-vias" placeholder="Escribe el nombre de la vía..." autocomplete="off">
                <datalist id="lista-vias"></datalist>
            </div>

            <div class="row-inputs">
                <div class="form-group" style="flex: 1;">
                    <p class="section-label">Inicio</p>
                    <input type="text" id="input-portal" class="input-field" placeholder="Portal">
                </div>
                <div class="form-group" style="flex: 1;">
                    <p class="section-label">Acera</p>
                    <select id="select-acera" class="input-field">
                        <option value="Ambas aceras">Ambas aceras</option>
                        <option value="Pares">Pares</option>
                        <option value="Impares">Impares</option>
                    </select>
                </div>
            </div>

            <button class="btn-insertar" onclick="insertarTramoJornada()">
                <span class="material-icons" style="font-size: 18px;">add</span> Insertar en la Jornada
            </button>

            <div class="reparto-diario-block">
                <p class="section-label">Orden de Reparto Diario</p>
                <div id="contenedor-lista-tramos" class="tramos-lista"></div>
                <p id="msg-lista-vacia" class="no-tramos-msg">No hay tramos cargados en la jornada.</p>
            </div>

            <button class="btn-finalizar" onclick="finalizarJornada()">Finalizar y Archivar Jornada</button>
        </div>

        <div class="map-sidebar">
            <div class="map-controls">
                <div class="map-btn"><span class="material-icons" style="font-size: 20px;">map</span></div>
                <div class="map-btn" onclick="alternarAjustes()"><span class="material-icons" style="font-size: 20px;">settings</span></div>
            </div>
        </div>

        <div class="ajustes-panel" id="panel-ajustes-modulo">
            <div class="ajustes-header">
                <h2>Ajustes</h2>
                <span class="material-icons" style="cursor: pointer; font-size: 28px;" onclick="alternarAjustes()">expand_more</span>
            </div>

            <div class="ajustes-row">
                <span>Filtro Visión Nocturna</span>
                <input type="checkbox" style="width: 18px; height: 18px; accent-color: var(--accent-blue);">
            </div>

            <div class="status-box-download" id="tarjeta-estado-contenedor">
                <div class="status-box-header">
                    <span class="status-badge" id="lbl-estado-badge" style="color: var(--accent-green);">DESCARGADO CORRECTAMENTE</span>
                    <span class="size-badge" id="lbl-estado-tamano">0.0 KB</span>
                </div>
                <div class="status-box-body">
                    <p>término: <strong id="lbl-nombre-pueblo">Catarroja</strong></p>
                    <p id="lbl-conteo-detallado">vías en memoria local: 0 calles registradas.</p>
                </div>
            </div>

            <div class="ajustes-actions-row">
                <button class="btn-ajuste btn-ajuste-primary" onclick="descargarCallesMunicipio()">Actualizar base</button>
                <button class="btn-ajuste btn-ajuste-danger" onclick="eliminarCallesLocales()">Borrar datos</button>
            </div>

            <button class="btn-ota">Firmas HTTP OTA Versión</button>
        </div>

    </div>
</div>

<script>
    let terminoActual = "Catarroja";
    let viasEnMemoria = [];
    let tramosJornada = [];

    // Gestión e indexación limpia de los municipios
    function cambiarTerminoDeTrabajo(nuevoTermino) {
        if (terminoActual === nuevoTermino) return;
        terminoActual = nuevoTermino;
        
        document.querySelectorAll('.termino-btn').forEach(btn => {
            if (btn.textContent.trim() === nuevoTermino) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        document.getElementById("input-busqueda-vias").value = "";
        cargarDatosMunicipales();
    }

    // Consulta e indexación Overpass API (Urbana Completa)
    async function descargarCallesMunicipio() {
        actualizarUIAlmacenamiento("DESCARGANDO...", "Consultando pasarelas Overpass...", "0.0 KB", "#f59e0b", "#78350f");

        const queryOverpass = `
            [out:json][timeout:90];
            area["name"="${terminoActual}"]["admin_level"=8]->.searchArea;
            (
              way["highway"~"residential|unclassified|pedestrian|living_street|service|tertiary|secondary|primary"](area.searchArea);
            );
            out tags;
        `;
        
        const endpointUrl = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(queryOverpass)}`;

        try {
            const respuesta = await fetch(endpointUrl);
            if (!respuesta.ok) throw new Error("Fallo de red en servidores OSM.");
            
            const datosJSON = await respuesta.json();
            let listaCallesUnicas = new Set();
            
            if (datosJSON.elements && datosJSON.elements.length > 0) {
                datosJSON.elements.forEach(elemento => {
                    if (elemento.tags && elemento.tags.name) {
                        listaCallesUnicas.add(elemento.tags.name.trim());
                    }
                });
            }

            viasEnMemoria = Array.from(listaCallesUnicas).sort((a, b) => a.localeCompare(b));
            if (viasEnMemoria.length === 0) throw new Error("Área sin registros válidos.");

            localStorage.setItem(`vias_${terminoActual}`, JSON.stringify(viasEnMemoria));
            renderizarDatalist();
            
            const bytes = new Blob([JSON.stringify(viasEnMemoria)]).size;
            actualizarUIAlmacenamiento("DESCARGADO CORRECTAMENTE", `${viasEnMemoria.length} calles registradas.`, `${(bytes / 1024).toFixed(1)} KB`, "#10b981", "#064e3b");
            
        } catch (error) {
            console.error(error);
            actualizarUIAlmacenamiento("ERROR EN DESCARGA", "Error al procesar el callejero.", "0.0 KB", "#ef4444", "#7f1d1d");
        }
    }

    // Sincronización LocalStorage
    function cargarDatosMunicipales() {
        document.getElementById("lbl-nombre-pueblo").textContent = terminoActual;
        const persistenciaLocal = localStorage.getItem(`vias_${terminoActual}`);
        
        if (persistenciaLocal) {
            viasEnMemoria = JSON.parse(persistenciaLocal);
            renderizarDatalist();
            const kb = (new Blob([persistenciaLocal]).size / 1024).toFixed(1);
            actualizarUIAlmacenamiento("DESCARGADO CORRECTAMENTE", `${viasEnMemoria.length} calles registradas.`, `${kb} KB`, "#10b981", "#064e3b");
        } else {
            viasEnMemoria = [];
            renderizarDatalist();
            actualizarUIAlmacenamiento("SIN DATOS", "Sin calles en memoria local.", "0.0 KB", "#f59e0b", "#78350f");
        }
    }

    // Rellenar sugerencias del Input
    function renderizarDatalist() {
        const datalist = document.getElementById("lista-vias");
        datalist.innerHTML = "";
        viasEnMemoria.forEach(calle => {
            const option = document.createElement("option");
            option.value = calle;
            datalist.appendChild(option);
        });
    }

    // Insertar tramos de reparto reales
    function insertarTramoJornada() {
        const calleElement = document.getElementById("input-busqueda-vias");
        const portalElement = document.getElementById("input-portal");
        const aceraElement = document.getElementById("select-acera");

        if (!calleElement.value.trim()) {
            alert("Escribe o selecciona una vía urbana.");
            return;
        }

        const nuevoTramo = {
            id: Date.now(),
            calle: calleElement.value.trim(),
            portal: portalElement.value.trim() || 'S/N',
            acera: aceraElement.value
        };

        tramosJornada.push(nuevoTramo);
        
        calleElement.value = "";
        portalElement.value = "";

        actualizarListaTramosUI();
    }

    function eliminarTramo(id) {
        tramosJornada = tramosJornada.filter(t => t.id !== id);
        actualizarListaTramosUI();
    }

    function actualizarListaTramosUI() {
        const contenedor = document.getElementById("contenedor-lista-tramos");
        const msgVacio = document.getElementById("msg-lista-vacia");
        
        contenedor.innerHTML = "";

        if (tramosJornada.length === 0) {
            msgVacio.style.display = "block";
            return;
        }

        msgVacio.style.display = "none";
        tramosJornada.forEach((tramo, index) => {
            const item = document.createElement("div");
            item.className = "tramo-item";
            item.innerHTML = `
                <div>
                    <strong>${index + 1}. ${tramo.calle}</strong> - P. ${tramo.portal} (${tramo.acera})
                </div>
                <span class="remove" onclick="eliminarTramo(${tramo.id})">×</span>
            `;
            contenedor.appendChild(item);
        });
    }

    function finalizarJornada() {
        if(tramosJornada.length === 0) {
            alert("No hay tramos activos cargados.");
            return;
        }
        alert(`Jornada guardada con éxito. Registrados: ${tramosJornada.length} tramos.`);
        tramosJornada = [];
        actualizarListaTramosUI();
    }

    function eliminarCallesLocales() {
        localStorage.removeItem(`vias_${terminoActual}`);
        viasEnMemoria = [];
        renderizarDatalist();
        actualizarUIAlmacenamiento("DATOS BORRADOS", "0 calles registradas.", "0.0 KB", "#ef4444", "#7f1d1d");
    }

    function actualizarUIAlmacenamiento(titulo, subtexto, tamano, colorHex, colorFondoBadge) {
        document.getElementById("lbl-estado-badge").textContent = titulo;
        document.getElementById("lbl-estado-badge").style.color = colorHex;
        
        const txtTamano = document.getElementById("lbl-estado-tamano");
        txtTamano.textContent = tamano;
        txtTamano.style.color = colorHex;
        txtTamano.style.backgroundColor = colorFondoBadge;
        
        document.getElementById("lbl-conteo-detallado").textContent = `vías en memoria local: ${subtexto}`;
        document.getElementById("tarjeta-estado-contenedor").style.borderColor = colorHex;
    }

    function alternarAjustes() {
        document.getElementById("panel-ajustes-modulo").classList.toggle("open");
    }

    document.addEventListener("DOMContentLoaded", cargarDatosMunicipales);
</script>
</body>
</html>

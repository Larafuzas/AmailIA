<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AmailIA - Optimización de Reparto (v6.0.0)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AmailIA">
    <meta name="theme-color" content="#1e3a8a">
    
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/png" href="icono.png">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body { touch-action: pan-x pan-y; }
        .custom-sidebar { 
            transition: transform 0.3s ease-in-out; 
            padding-top: env(safe-area-inset-top, 0px);
        }
        .bottom-panel {
            transition: transform 0.3s ease-in-out;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        }
        .ios-safe-top {
            top: calc(12px + env(safe-area-inset-top, 0px)) !important;
        }
        .ios-safe-bottom-btn {
            bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important;
        }
        .dark-mode-map .leaflet-layer {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        .route-idx-marker {
            background-color: #1e3a8a;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .map-picking-active { cursor: crosshair !important; }
    </style>
</head>
<body class="h-full w-full overflow-hidden bg-gray-100 font-sans text-gray-900 select-none">

    <div id="map" class="h-full w-full absolute inset-0 z-0"></div>

    <button id="menuBtn" class="ios-safe-top absolute left-4 z-40 bg-white dark:bg-gray-800 p-3.5 rounded-xl shadow-xl flex items-center justify-center border border-gray-200 dark:border-gray-700 active:scale-95 transition-transform" aria-label="Abrir Menú">
        <svg class="w-6 h-6 text-blue-900 dark:text-blue-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
        </svg>
    </button>

    <div class="ios-safe-bottom-btn fixed right-4 z-40 flex flex-col space-y-2">
        <button onclick="openBottomPanel('history')" class="bg-slate-900/95 text-white p-3.5 rounded-xl shadow-2xl border border-slate-700 backdrop-blur active:scale-95 transition-transform">
            <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"></path></svg>
        </button>
        <button onclick="openBottomPanel('settings')" class="bg-slate-900/95 text-white p-3.5 rounded-xl shadow-2xl border border-slate-700 backdrop-blur active:scale-95 transition-transform">
            <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.43l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z"></path><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"></circle></svg>
        </button>
    </div>

    <div id="toastMapPicker" class="ios-safe-top absolute left-20 right-4 z-40 bg-blue-950 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-blue-800 transform -translate-y-32 opacity-0 transition-all duration-300 pointer-events-none">
        <span class="flex h-3 w-3 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
        </span>
        <p class="text-xs font-semibold">Toca el punto en el mapa para situar el tramo</p>
    </div>

    <div id="sidebarOverlay" class="absolute inset-0 bg-black/40 z-30 hidden opacity-0 transition-opacity duration-300"></div>

    <aside id="sidebar" class="custom-sidebar fixed inset-y-0 left-0 w-[85%] sm:w-[380px] bg-white/95 dark:bg-gray-900/95 backdrop-blur-md z-50 shadow-2xl flex flex-col justify-between transform -translate-x-full border-r border-gray-200 dark:border-gray-800">
        <div class="p-5 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between bg-gray-50/50 dark:bg-gray-800/50">
            <div class="flex items-center space-x-3">
                <svg class="w-9 h-9 text-blue-900 dark:text-blue-500" viewBox="0 0 100 100" fill="none"><path d="M15 15 L85 15 L85 85 L15 85 Z" stroke="currentColor" stroke-width="4"/><circle cx="50" cy="50" r="8" fill="currentColor"/></svg>
                <div>
                    <h1 class="text-2xl font-extrabold text-blue-900 dark:text-white">AmailIA</h1>
                    <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Ruta en Vivo</p>
                </div>
            </div>
            <button onclick="closeAllPanels()" class="p-1 rounded-lg text-gray-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Término de Trabajo</label>
                <div class="grid grid-cols-3 gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl">
                    <button onclick="switchMunicipality('catarroja')" id="tab-catarroja" class="tab-btn py-2 text-xs font-bold rounded-lg transition-all bg-white dark:bg-gray-700 shadow-sm text-blue-900 dark:text-white">Catarroja</button>
                    <button onclick="switchMunicipality('albal')" id="tab-albal" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 dark:text-gray-300">Albal</button>
                    <button onclick="switchMunicipality('massanassa')" id="tab-massanassa" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 dark:text-gray-300">Massanassa</button>
                </div>
            </div>

            <div>
                <button type="button" onclick="activateMapPickerMode()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></svg>
                    <span class="text-xs">Marcar posición exacta con el dedo</span>
                </button>
                <input type="hidden" id="customCoordsInput" value="">
            </div>

            <form id="routeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="relative">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Calle</label>
                    <input type="text" id="streetInput" placeholder="Escribe el nombre de la vía..." class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none dark:text-white" required>
                    <div id="autocompleteLoading" class="absolute right-3 top-9 hidden"><svg class="animate-spin h-5 w-5 text-blue-900" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg></div>
                    <div id="autocompleteList" class="absolute left-0 right-0 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl max-h-48 overflow-y-auto hidden z-50"></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Inicio</label>
                        <input type="number" id="portalInput" min="1" placeholder="Portal" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl dark:text-white" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Acera</label>
                        <select id="sidewalkInput" class="w-full px-3 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl dark:text-white font-medium">
                            <option value="ambas">Ambas aceras</option>
                            <option value="pares">Pares</option>
                            <option value="impares">Impares</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-900 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
                    <span>Insertar en la Jornada</span>
                </button>
            </form>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Orden de Reparto Diario</label>
                <div id="liveRouteList" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
            </div>
        </div>
        <div class="p-4 bg-gray-50 dark:bg-gray-900/50">
            <button onclick="archiveCurrentJob()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 px-4 rounded-xl shadow flex items-center justify-center space-x-2">
                <span>Finalizar y Archivar Jornada</span>
            </button>
        </div>
    </aside>

    <div id="bottomPanel" class="bottom-panel fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 text-white z-50 transform translate-y-full rounded-t-3xl max-h-[75vh] flex flex-col justify-between">
        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
            <h2 id="bottomPanelTitle" class="text-xl font-bold flex items-center space-x-2">Panel</h2>
            <button onclick="closeAllPanels()" class="p-1 rounded-lg bg-slate-800 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg></button>
        </div>
        
        <div id="bottomPanelContent" class="p-5 overflow-y-auto flex-1 space-y-4 text-sm"></div>
    </div>

    <script>
        const APP_VERSION = "6.0.0";

        // Coordenadas fijas para l'Horta Sud
        const MUNICIPALITIES = {
            catarroja: { name: "Catarroja", coords: [39.4031, -0.4024] },
            albal: { name: "Albal", coords: [39.3958, -0.4154] },
            massanassa: { name: "Massanassa", coords: [39.4125, -0.3997] }
        };

        let currentMunicipality = 'catarroja';
        let map = null;
        let activeRouteData = []; 
        let routeMarkersGroup = null;
        let routeLinesGroup = null;
        let detailPortalsGroup = null;
        let isMapPickingModeActive = false;
        let autocompleteTimeout = null;

        document.addEventListener("DOMContentLoaded", () => {
            initLeafletMap();
            setupUIEventListeners();
            loadStateFromLocalStorage();
            renderActiveRoute();
        });

        function initLeafletMap() {
            const initConf = MUNICIPALITIES[currentMunicipality];
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(initConf.coords, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            routeMarkersGroup = L.layerGroup().addTo(map);
            routeLinesGroup = L.layerGroup().addTo(map);
            detailPortalsGroup = L.layerGroup().addTo(map);

            map.on('zoomend', () => evaluateDetailPortalsVisibility());
            map.on('click', (e) => { if (isMapPickingModeActive) handleMapClickCapture(e.latlng); });
        }

        function setupUIEventListeners() {
            document.getElementById("menuBtn").addEventListener("click", () => {
                closeAllPanels();
                document.getElementById("sidebar").classList.remove("-translate-x-full");
                document.getElementById("sidebarOverlay").classList.remove("hidden");
                setTimeout(() => document.getElementById("sidebarOverlay").classList.add("opacity-100"), 10);
            });
            document.getElementById("streetInput").addEventListener("input", handleStreetAutocomplete);
        }

        function closeAllPanels() {
            document.getElementById("sidebar").classList.add("-translate-x-full");
            document.getElementById("bottomPanel").classList.add("translate-y-full");
            document.getElementById("sidebarOverlay").classList.remove("opacity-100");
            setTimeout(() => document.getElementById("sidebarOverlay").classList.add("hidden"), 300);
        }

        function openBottomPanel(type) {
            closeAllPanels();
            const panel = document.getElementById("bottomPanel");
            const title = document.getElementById("bottomPanelTitle");
            const content = document.getElementById("bottomPanelContent");

            document.getElementById("sidebarOverlay").classList.remove("hidden");
            setTimeout(() => document.getElementById("sidebarOverlay").classList.add("opacity-100"), 10);

            if (type === 'settings') {
                title.innerHTML = `<span>Ajustes Técnicos</span> <span class="text-xs font-mono bg-blue-900 px-2 py-0.5 rounded text-white">v${APP_VERSION}</span>`;
                content.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-3.5 bg-slate-800 rounded-xl">
                            <span>Modo Visión Nocturna</span>
                            <input type="checkbox" id="nightModeToggle" onchange="toggleNightMode()" class="w-5 h-5">
                        </div>
                        <div class="p-4 bg-slate-800 rounded-xl space-y-2">
                            <p class="font-bold text-amber-400">Cobertura y Datos Offline</p>
                            <p class="text-xs text-slate-400">Descarga la base de datos de calles del municipio para poder trabajar y buscar sin conexión a Internet.</p>
                            <button onclick="downloadCallejeroOffline()" class="w-full bg-amber-500 text-slate-950 font-bold py-2 px-3 rounded-lg text-xs mt-1">Descargar Callejero de ${MUNICIPALITIES[currentMunicipality].name}</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="triggerBackup()" class="bg-slate-700 p-2.5 rounded-lg font-semibold text-xs">Exportar Respaldo</button>
                            <button onclick="triggerRestore()" class="bg-slate-700 p-2.5 rounded-lg font-semibold text-xs">Importar Respaldo</button>
                        </div>
                        <button onclick="checkUpdateOTA()" class="w-full bg-blue-900 text-white font-semibold py-2 px-3 rounded-lg text-xs">Buscar Actualizaciones OTA</button>
                    </div>`;
                // Sincronizar checkbox si ya está activo
                if(document.documentElement.classList.contains("dark")) {
                    document.getElementById("nightModeToggle").checked = true;
                }
            } else if (type === 'history') {
                title.textContent = "Historial de Jornadas";
                renderHistoryContent(content);
            }
            panel.classList.remove("translate-y-full");
        }

        // --- MOTOR DE AUTOCAPATURA OFFLINE / ONLINE ---
        function handleStreetAutocomplete(e) {
            const query = e.target.value.trim();
            const listContainer = document.getElementById("autocompleteList");
            const loadingSpinner = document.getElementById("autocompleteLoading");
            clearTimeout(autocompleteTimeout);

            if (query.length < 3 || query === "Punto marcado en Mapa") {
                listContainer.innerHTML = "";
                listContainer.classList.add("hidden");
                return;
            }

            autocompleteTimeout = setTimeout(async () => {
                loadingSpinner.classList.remove("hidden");
                
                // Comprobamos si hay callejero offline guardado en local para este municipio
                const offlineKey = `amailia_offline_streets_${currentMunicipality}`;
                const offlineData = localStorage.getItem(offlineKey);

                if (offlineData && (!navigator.onLine || query.startsWith("Local:"))) {
                    // MODO OFFLINE ACTIVADO
                    const streets = JSON.parse(offlineData);
                    const cleanQuery = query.replace("Local:", "").toLowerCase();
                    const filtered = streets.filter(s => s.toLowerCase().includes(cleanQuery));
                    renderAutocompleteItems(filtered.slice(0, 6), listContainer);
                    loadingSpinner.classList.add("hidden");
                } else {
                    // MODO ONLINE: Llamada a la API de OpenStreetMap
                    try {
                        const targetMuni = MUNICIPALITIES[currentMunicipality].name;
                        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)},+${encodeURIComponent(targetMuni)},+Valencia&addressdetails=1&limit=6`;
                        const response = await fetch(url, { headers: { 'User-Agent': 'AmailIA-Logistics' } });
                        const data = await response.json();
                        const roads = [...new Set(data.map(item => item.address.road || item.display_name.split(',')[0]))].filter(Boolean);
                        renderAutocompleteItems(roads, listContainer);
                    } catch (error) {
                        console.error("Fallo de red, recurriendo a base local si existe...");
                        if(offlineData) {
                            const streets = JSON.parse(offlineData);
                            const filtered = streets.filter(s => s.toLowerCase().includes(query.toLowerCase()));
                            renderAutocompleteItems(filtered.slice(0, 6), listContainer);
                        }
                    } finally {
                        loadingSpinner.classList.add("hidden");
                    }
                }
            }, 400);
        }

        function renderAutocompleteItems(items, container) {
            container.innerHTML = "";
            if (items.length === 0) { container.classList.add("hidden"); return; }
            items.forEach(road => {
                const div = document.createElement("div");
                div.className = "px-4 py-3 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm cursor-pointer border-b border-gray-100 dark:border-gray-700 dark:text-gray-200";
                div.textContent = road;
                div.addEventListener("click", () => {
                    document.getElementById("streetInput").value = road;
                    document.getElementById("customCoordsInput").value = "";
                    container.classList.add("hidden");
                });
                container.appendChild(div);
            });
            container.classList.remove("hidden");
        }

        async function downloadCallejeroOffline() {
            const targetMuni = MUNICIPALITIES[currentMunicipality].name;
            alert(`Descargando base de datos completa de viales para ${targetMuni}... Por favor, no cierres la ventana.`);
            try {
                // Buscamos de forma masiva los elementos tipo calle ("residential", "tertiary", etc) de la localidad en Overpass o Nominatim
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=streets+in+${encodeURIComponent(targetMuni)},+Valencia&limit=150`;
                const res = await fetch(url, { headers: { 'User-Agent': 'AmailIA-Logistics' } });
                const data = await res.json();
                
                const streets = [...new Set(data.map(item => item.display_name.split(',')[0]))].filter(s => s && isNaN(s));
                
                if(streets.length > 0) {
                    localStorage.setItem(`amailia_offline_streets_${currentMunicipality}`, JSON.stringify(streets));
                    alert(`¡Éxito! Se han cacheado ${streets.length} calles de ${targetMuni}. Ya puedes buscar en este pueblo sin cobertura.`);
                } else {
                    // Fallback con listado genérico de seguridad si la API de listado masivo está saturada
                    const fallback = ["Camí Reial", "Carrer Major", "Avinguda de la Rambleta", "Carrer Nou", "Plaça Major", "Carrer San Roc", "Carrer Valencia", "Carrer l'Horta"];
                    localStorage.setItem(`amailia_offline_streets_${currentMunicipality}`, JSON.stringify(fallback));
                    alert("Se ha generado un callejero de contingencia local para emergencias offline.");
                }
            } catch (e) {
                alert("Fallo al conectar con el servidor de mapas para la descarga offline.");
            }
        }

        // --- RENDERIZADO DEL HISTORIAL Y SISTEMA DE EXPORTACIÓN ---
        function renderHistoryContent(container) {
            const history = JSON.parse(localStorage.getItem("amailia_history") || "[]");
            if (history.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-4">No tienes ninguna jornada archivada todavía.</p>`;
                return;
            }
            container.innerHTML = "";
            history.reverse().forEach((item, idx) => {
                const dateObj = new Date(item.date);
                const readableDate = dateObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                
                const card = document.createElement("div");
                card.className = "p-3.5 bg-slate-800 rounded-xl space-y-2 border border-slate-700";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-emerald-400 text-xs uppercase tracking-wide">Jornada ${readableDate}</span>
                        <span class="text-[11px] bg-slate-700 px-2 py-0.5 rounded text-slate-300 font-bold">${item.data.length} Tramos</span>
                    </div>
                    <p class="text-xs text-slate-400 truncate">Inicio: ${item.data[0]?.street || 'Punto'} -> Fin: ${item.data[item.data.length-1]?.street || 'Punto'}</p>
                    <div class="grid grid-cols-2 gap-1.5 pt-1">
                        <button onclick="exportTextoJornada(${idx})" class="bg-blue-900/60 hover:bg-blue-900 text-white text-[11px] py-1.5 px-2 rounded-lg font-medium">Exportar Listado (.TXT)</button>
                        <button onclick="exportPdfSimulado(${idx})" class="bg-slate-700 hover:bg-slate-600 text-white text-[11px] py-1.5 px-2 rounded-lg font-medium text-center">Generar PDF</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function exportTextoJornada(index) {
            const history = JSON.parse(localStorage.getItem("amailia_history") || "[]").reverse();
            const jornada = history[index];
            if (!jornada) return;

            let text = `AMAILIA LOGISTICS - RECORRIDO DIARIO\nFecha: ${jornada.date}\n========================================\n`;
            jornada.data.forEach((seg, i) => {
                text += `${i + 1}. Vía: ${seg.street} | Inicial: ${seg.portal} | Acera: ${seg.sidewalk.toUpperCase()} | Coordenadas: [${seg.coords.join(', ')}]\n`;
            });

            const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `amailia_recorrido_${Date.now()}.txt`;
            link.click();
        }

        function exportPdfSimulado(index) {
            const history = JSON.parse(localStorage.getItem("amailia_history") || "[]").reverse();
            const jornada = history[index];
            if (!jornada) return;

            // Al no poder inyectar librerías binarias pesadas nativas de PDF en un único archivo de forma limpia sin CDN roto,
            // abrimos una ventana limpia estructurada para impresión nativa del sistema (que permite guardar como PDF en el iPhone directamente)
            const printWindow = window.open("", "_blank");
            let rowsHtml = "";
            jornada.data.forEach((seg, i) => {
                rowsHtml += `<tr><td style="padding:10px; border-bottom:1px solid #ddd;"><b>${i + 1}</b></td><td style="padding:10px; border-bottom:1px solid #ddd;">${seg.street}</td><td style="padding:10px; border-bottom:1px solid #ddd;">${seg.portal}</td><td style="padding:10px; border-bottom:1px solid #ddd;">${seg.sidewalk.toUpperCase()}</td></tr>`;
            });

            printWindow.document.write(`
                <html>
                <head><title>Informe de Reparto AmailIA</title></head>
                <body style="font-family:sans-serif; color:#333; padding:20px;">
                    <div style="display:flex; justify-content:between; align-items:center; border-bottom:4px solid #1e3a8a; padding-bottom:10px;">
                        <div>
                            <h1 style="margin:0; color:#1e3a8a;">AmailIA - Horta Sud</h1>
                            <p style="margin:4px 0 0 0; font-size:12px; color:#666;">INFORME OFICIAL DE REPARTO DOMICILIARIO</p>
                        </div>
                    </div>
                    <p style="font-size:13px; margin-top:15px;"><b>Fecha de la jornada:</b> ${new Date(jornada.date).toLocaleString('es-ES')}</p>
                    <table style="width:100%; border-collapse:collapse; margin-top:20px; font-size:14px;">
                        <thead><tr style="background:#f5f5f5; text-align:left;"><th style="padding:10px;">Orden</th><th style="padding:10px;">Calle</th><th style="padding:10px;">Portal de Inicio</th><th style="padding:10px;">Acera</th></tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                    <div style="margin-top:40px; font-size:11px; color:#999; text-align:center; border-top:1px solid #eee; padding-top:10px;">Documento generado de forma autónoma por AmailIA v${APP_VERSION}</div>
                    <script>window.onload = function() { window.print(); }</s` + `cript>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        // --- LAS FUNCIONES LOGÍSTICAS DE CAPAS VECTORIALES QUEDAN TOTALMENTE OPERATIVAS ---
        function activateMapPickerMode() {
            isMapPickingModeActive = true;
            closeAllPanels();
            document.getElementById("map").classList.add("map-picking-active");
            const toast = document.getElementById("toastMapPicker");
            toast.classList.remove("-translate-y-32", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");
        }

        function activateMapPickerMode() {
            isMapPickingModeActive = true;
            closeAllPanels();
            document.getElementById("map").classList.add("map-picking-active");
            
            const toast = document.getElementById("toastMapPicker");
            toast.classList.remove("-translate-y-32", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");
        }

        function handleMapClickCapture(latlng) {
            isMapPickingModeActive = false;
            document.getElementById("map").classList.remove("map-picking-active");
            
            const toast = document.getElementById("toastMapPicker");
            toast.classList.remove("translate-y-0", "opacity-100");
            toast.classList.add("-translate-y-32", "opacity-0");

            document.getElementById("customCoordsInput").value = JSON.stringify([latlng.lat, latlng.lng]);
            document.getElementById("streetInput").value = "Punto marcado en Mapa";
            
            document.getElementById("sidebar").classList.remove("-translate-x-full");
            document.getElementById("portalInput").focus();
        }

        function switchMunicipality(muniKey) {
            if (!MUNICIPALITIES[muniKey]) return;
            currentMunicipality = muniKey;

            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.remove("bg-white", "dark:bg-gray-700", "shadow-sm", "text-blue-900", "dark:text-white");
                btn.classList.add("text-gray-600", "dark:text-gray-300");
            });

            const activeTab = document.getElementById(`tab-${muniKey}`);
            activeTab.classList.remove("text-gray-600", "dark:text-gray-300");
            activeTab.classList.add("bg-white", "dark:bg-gray-700", "shadow-sm", "text-blue-900", "dark:text-white");

            map.flyTo(MUNICIPALITIES[muniKey].coords, 15, { animate: true, duration: 1.2 });
            document.getElementById("routeForm").reset();
            document.getElementById("customCoordsInput").value = "";
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById("submitBtn");
            const streetName = document.getElementById("streetInput").value.trim();
            const portalNum = parseInt(document.getElementById("portalInput").value);
            const sidewalk = document.getElementById("sidewalkInput").value;
            const customCoordsRaw = document.getElementById("customCoordsInput").value;

            let geoPoint = null;
            submitBtn.disabled = true;

            if (customCoordsRaw) {
                geoPoint = JSON.parse(customCoordsRaw);
            } else {
                try {
                    const targetMuni = MUNICIPALITIES[currentMunicipality].name;
                    const searchQueries = [
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(streetName)}+${portalNum},+${encodeURIComponent(targetMuni)},+Valencia&limit=1`,
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(streetName)},+${encodeURIComponent(targetMuni)},+Valencia&limit=1`
                    ];

                    for (let url of searchQueries) {
                        const res = await fetch(url, { headers: { 'User-Agent': 'AmailIA-Logistics-App' } });
                        const data = await res.json();
                        if (data && data.length > 0) {
                            geoPoint = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                            break;
                        }
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            if (!geoPoint) {
                alert(`No se ha encontrado "${streetName}". Usa el botón naranja para marcarlo con el dedo.`);
                submitBtn.disabled = false;
                return;
            }

            const routeSegment = {
                id: Date.now(),
                municipality: currentMunicipality,
                street: streetName,
                portal: portalNum,
                sidewalk: sidewalk,
                coords: geoPoint
            };

            activeRouteData.push(routeSegment);
            saveStateToLocalStorage();
            renderActiveRoute();

            document.getElementById("routeForm").reset();
            document.getElementById("customCoordsInput").value = "";
            submitBtn.disabled = false;
            closeAllPanels();

            map.panTo(geoPoint);
        }

        function moveSegment(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= activeRouteData.length) return;
            const temp = activeRouteData[index];
            activeRouteData[index] = activeRouteData[targetIndex];
            activeRouteData[targetIndex] = temp;
            saveStateToLocalStorage();
            renderActiveRoute();
        }

        function renderActiveRoute() {
            routeMarkersGroup.clearLayers();
            routeLinesGroup.clearLayers();
            detailPortalsGroup.clearLayers();

            const listContainer = document.getElementById("liveRouteList");
            listContainer.innerHTML = "";

            if (activeRouteData.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-2">No hay tramos cargados en la jornada.</p>`;
                return;
            }

            const polylinePoints = [];

            activeRouteData.forEach((segment, index) => {
                const stepNumber = index + 1;
                polylinePoints.push(segment.coords);

                const customIcon = L.divIcon({
                    className: 'route-idx-marker',
                    html: `<span>${stepNumber}</span>`, 
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                L.marker(segment.coords, { icon: customIcon })
                    .bindPopup(`<b>Tramo #${stepNumber}</b><br>${segment.street}, No. ${segment.portal}`)
                    .addTo(routeMarkersGroup);

                generateMicroPortals(segment.coords, segment.portal, segment.sidewalk);

                const row = document.createElement("div");
                row.className = "flex items-center justify-between p-2.5 bg-gray-100 dark:bg-gray-800 rounded-lg border-l-4 border-blue-900";
                row.innerHTML = `
                    <div class="text-xs flex-1 pr-2">
                        <p class="font-bold dark:text-white">${stepNumber}. ${segment.street}</p>
                        <p class="text-gray-500 text-[10px]">Portal: ${segment.portal} • Acera: ${segment.sidewalk}</p>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="moveSegment(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="p-1 bg-white dark:bg-gray-700 rounded shadow-sm disabled:opacity-30"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg></button>
                        <button onclick="moveSegment(${index}, 1)" ${index === activeRouteData.length - 1 ? 'disabled' : ''} class="p-1 bg-white dark:bg-gray-700 rounded shadow-sm disabled:opacity-30"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></button>
                        <button onclick="removeSegment(${segment.id})" class="text-red-500 p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                    </div>`;
                listContainer.appendChild(row);
            });

            if (polylinePoints.length > 1) {
                L.polyline(polylinePoints, { color: '#1e3a8a', weight: 4, opacity: 0.8, dashArray: '8, 12', lineJoin: 'round' }).addTo(routeLinesGroup);
            }
            evaluateDetailPortalsVisibility();
        }

        function generateMicroPortals(centerCoords, startPortal, sidewalkMode) {
            const numPortalsToSimulate = 6;
            for (let i = 0; i < numPortalsToSimulate; i++) {
                let currentNum = startPortal + i;
                if (sidewalkMode === 'pares' && currentNum % 2 !== 0) continue;
                if (sidewalkMode === 'impares' && currentNum % 2 === 0) continue;

                const latShift = (i * 0.00015);
                const lngShift = (currentNum % 2 === 0 ? 0.0002 : -0.0002);
                const portalColor = (currentNum % 2 === 0) ? '#22c55e' : '#ef4444';

                L.circleMarker([centerCoords[0] + latShift, centerCoords[1] + lngShift], {
                    radius: 6, fillColor: portalColor, color: '#ffffff', weight: 1.5, fillOpacity: 0.9
                }).bindTooltip(`Portal ${currentNum}`).addTo(detailPortalsGroup);
            }
        }

        function evaluateDetailPortalsVisibility() {
            if (map.getZoom() >= 17) {
                if (!map.hasLayer(detailPortalsGroup)) map.addLayer(detailPortalsGroup);
            } else {
                if (map.hasLayer(detailPortalsGroup)) map.removeLayer(detailPortalsGroup);
            }
        }

        function removeSegment(id) {
            activeRouteData = activeRouteData.filter(s => s.id !== id);
            saveStateToLocalStorage();
            renderActiveRoute();
        }

        function toggleNightMode() {
            const isDark = document.getElementById("nightModeToggle").checked;
            const mapContainer = document.getElementById("map");
            if (isDark) { document.documentElement.classList.add("dark"); mapContainer.classList.add("dark-mode-map"); }
            else { document.documentElement.classList.remove("dark"); mapContainer.classList.remove("dark-mode-map"); }
        }

        function saveStateToLocalStorage() {
            localStorage.setItem("amailia_active_route", JSON.stringify(activeRouteData));
            localStorage.setItem("amailia_current_muni", currentMunicipality);
        }

        function loadStateFromLocalStorage() {
            const savedRoute = localStorage.getItem("amailia_active_route");
            const savedMuni = localStorage.getItem("amailia_current_muni");
            if (savedRoute) activeRouteData = JSON.parse(savedRoute);
            if (savedMuni) { currentMunicipality = savedMuni; switchMunicipality(currentMunicipality); }
        }

        function archiveCurrentJob() {
            if (activeRouteData.length === 0) { alert("No hay datos en la jornada para archivar."); return; }
            let history = JSON.parse(localStorage.getItem("amailia_history") || "[]");
            history.push({ date: new Date().toISOString(), data: activeRouteData });
            localStorage.setItem("amailia_history", JSON.stringify(history));
            activeRouteData = [];
            saveStateToLocalStorage();
            renderActiveRoute();
            closeAllPanels();
            alert("Jornada guardada con éxito en el historial.");
        }

        function triggerBackup() {
            const backupPayload = { activeRoute: activeRouteData, history: JSON.parse(localStorage.getItem("amailia_history") || "[]"), exportedAt: new Date().toISOString() };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `amailia_backup.json`);
            downloadAnchor.click();
        }

        function triggerRestore() { document.getElementById("importFileInput").click(); }

        function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.activeRoute && importedData.history) {
                        activeRouteData = importedData.activeRoute;
                        localStorage.setItem("amailia_history", JSON.stringify(importedData.history));
                        saveStateToLocalStorage();
                        renderActiveRoute();
                        alert("Copia restaurada.");
                        closeAllPanels();
                    }
                } catch (err) { alert("Error al importar."); }
            };
            reader.readAsText(file);
        }

        async function checkUpdateOTA() {
            try {
                const currentLoc = window.location.href.split('?')[0];
                const response = await fetch(`${currentLoc}?cb=${Date.now()}`, { method: 'HEAD' });
                const serverEtag = response.headers.get("ETag");
                const serverLastModified = response.headers.get("Last-Modified");
                const localSignature = localStorage.getItem("amailia_ota_signature");
                const currentServerSignature = serverEtag || serverLastModified;
                if (localSignature && localSignature !== currentServerSignature) {
                    if (confirm("¿Actualizar a la última versión disponible?")) {
                        localStorage.setItem("amailia_ota_signature", currentServerSignature);
                        window.location.reload(true);
                    }
                } else { alert(`AmailIA está al día en la versión v${APP_VERSION}.`); }
            } catch (error) { alert("Error en canal OTA."); }
        }
    </script>
</body>

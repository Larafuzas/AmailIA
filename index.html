<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AmailIA - Optimización de Reparto (v4.1)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body { touch-action: pan-x pan-y; }
        .custom-sidebar { 
            transition: transform 0.3s ease-in-out; 
            padding-top: env(safe-area-inset-top, 0px);
        }
        
        .ios-safe-top {
            top: calc(12px + env(safe-area-inset-top, 0px)) !important;
        }

        /* Filtro CSS para Modo Noche del Mapa */
        .dark-mode-map .leaflet-layer {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        
        /* Estilos para marcadores numéricos de la ruta */
        .route-idx-marker {
            background-color: #1e3a8a;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .map-picking-active {
            cursor: crosshair !important;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden bg-gray-100 font-sans text-gray-900 select-none">

    <div id="map" class="h-full w-full absolute inset-0 z-0"></div>

    <button id="menuBtn" class="ios-safe-top absolute left-4 z-40 bg-white dark:bg-gray-800 p-3.5 rounded-xl shadow-xl flex items-center justify-center border border-gray-200 dark:border-gray-700 active:scale-95 transition-transform" aria-label="Abrir Menú">
        <svg class="w-6 h-6 text-blue-900 dark:text-blue-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="toastMapPicker" class="ios-safe-top absolute left-20 right-4 z-40 bg-blue-950 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-blue-800 transform -translate-y-32 opacity-0 transition-all duration-300 pointer-events-none">
        <span class="flex h-3 w-3 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
        </span>
        <p class="text-xs font-semibold">Toca el punto exacto en el mapa para situar el tramo</p>
    </div>

    <div id="sidebarOverlay" class="absolute inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-300"></div>

    <aside id="sidebar" class="custom-sidebar fixed inset-y-0 left-0 w-[85%] sm:w-[380px] bg-white/95 dark:bg-gray-900/95 backdrop-blur-md z-50 shadow-2xl flex flex-col justify-between transform -translate-x-full border-r border-gray-200 dark:border-gray-800">
        
        <div class="p-5 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between bg-gray-50/50 dark:bg-gray-800/50">
            <div class="flex items-center space-x-3">
                <svg class="w-9 h-9 text-blue-900 dark:text-blue-500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 15 L85 15 L85 85 L15 85 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/>
                    <path d="M15 50 L85 50" stroke="currentColor" stroke-width="6" stroke-dasharray="2 4"/>
                    <path d="M50 15 L50 85" stroke="currentColor" stroke-width="6"/>
                    <path d="M15 15 L85 85" stroke="currentColor" stroke-width="3"/>
                    <circle cx="50" cy="50" r="8" fill="currentColor"/>
                    <circle cx="15" cy="15" r="5" fill="#ef4444"/>
                    <circle cx="85" cy="85" r="5" fill="#22c55e"/>
                </svg>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-blue-900 dark:text-white">AmailIA</h1>
                    <p class="text-[10px] uppercase tracking-widest text-gray-500 dark:text-gray-400 font-bold">Horta Sud Logistics</p>
                </div>
            </div>
            <button id="closeSidebarBtn" class="p-1 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6">
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Municipio de Cobertura</label>
                <div class="grid grid-cols-3 gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl">
                    <button onclick="switchMunicipality('catarroja')" id="tab-catarroja" class="tab-btn py-2 text-xs font-bold rounded-lg transition-all bg-white dark:bg-gray-700 shadow-sm text-blue-900 dark:text-white">Catarroja</button>
                    <button onclick="switchMunicipality('albal')" id="tab-albal" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 dark:text-gray-300">Albal</button>
                    <button onclick="switchMunicipality('massanassa')" id="tab-massanassa" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 dark:text-gray-300">Massanassa</button>
                </div>
            </div>

            <div>
                <button type="button" onclick="activateMapPickerMode()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center space-x-2 active:scale-[0.99] transition-transform">
                    <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>
                    </svg>
                    <span class="text-xs">Marcar punto con el dedo en el mapa</span>
                </button>
                <input type="hidden" id="customCoordsInput" value="">
            </div>

            <form id="routeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="relative">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Nombre de la Calle</label>
                    <input type="text" id="streetInput" autocomplete="off" placeholder="Ej. Camí Reial" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none dark:text-white" required>
                    <div id="autocompleteLoading" class="absolute right-3 top-9 hidden">
                        <svg class="animate-spin h-5 w-5 text-blue-900 dark:text-blue-400" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                    <div id="autocompleteList" class="absolute left-0 right-0 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl max-h-48 overflow-y-auto hidden z-50"></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Portal de Inicio</label>
                        <input type="number" id="portalInput" min="1" placeholder="1" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none dark:text-white" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Acera de Trabajo</label>
                        <select id="sidewalkInput" class="w-full px-3 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none dark:text-white font-medium">
                            <option value="ambas">Ambas</option>
                            <option value="pares">Solo Pares</option>
                            <option value="impares">Solo Impares</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center space-x-2 active:scale-[0.99] transition-transform">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    <span>Añadir Tramo a la Jornada</span>
                </button>
            </form>

            <hr class="border-gray-200 dark:border-gray-800">

            <div class="space-y-3">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Ajustes del Sistema</label>
                <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-800/40 rounded-xl">
                    <span class="text-sm font-semibold dark:text-gray-300 flex items-center space-x-2">
                        <svg class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                        <span>Visión Nocturna / Filtro Dark</span>
                    </span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="nightModeToggle" onchange="toggleNightMode()" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Tramos de la Ruta Actual</label>
                <div id="liveRouteList" class="space-y-2 max-h-44 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 italic text-center py-2">No hay tramos cargados en la jornada.</p>
                </div>
            </div>

        </div>

        <div class="p-4 border-t border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/30 space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="triggerBackup()" class="text-xs bg-gray-200 dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-300 p-2.5 rounded-lg font-bold flex items-center justify-center space-x-1">
                    <span>Exportar (.JSON)</span>
                </button>
                <button onclick="triggerRestore()" class="text-xs bg-gray-200 dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-300 p-2.5 rounded-lg font-bold flex items-center justify-center space-x-1">
                    <span>Importar Backup</span>
                </button>
            </div>
            
            <button onclick="archiveCurrentJob()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow flex items-center justify-center space-x-2">
                <span>Archivar Jornada en Historial</span>
            </button>

            <button onclick="checkUpdateOTA()" class="w-full bg-gray-900 dark:bg-gray-700 hover:bg-black dark:hover:bg-gray-600 text-white text-[11px] font-mono py-2 px-3 rounded-lg flex items-center justify-between">
                <span class="flex items-center space-x-1">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    <span>Sincronización OTA</span>
                </span>
                <span class="underline">Verificar Versión</span>
            </button>
        </div>
    </aside>

    <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="handleImportFile(event)">

    <script>
        const MUNICIPALITIES = {
            catarroja: { name: "Catarroja", cp: "46470", coords: [39.4031, -0.4024] },
            albal: { name: "Albal", cp: "46470", coords: [39.3958, -0.4154] },
            massanassa: { name: "Massanassa", cp: "46460", coords: [39.4125, -0.3997] }
        };

        let currentMunicipality = 'catarroja';
        let map = null;
        let activeRouteData = []; 
        let routeMarkersGroup = null;
        let routeLinesGroup = null;
        let detailPortalsGroup = null;
        let isMapPickingModeActive = false;
        let autocompleteTimeout = null;

        document.addEventListener("DOMContentLoaded", () => {
            initLeafletMap();
            setupUIEventListeners();
            loadStateFromLocalStorage();
            renderActiveRoute();
        });

        function initLeafletMap() {
            const initConf = MUNICIPALITIES[currentMunicipality];
            
            map = L.map('map', {
                zoomControl: false, 
                attributionControl: false
            }).setView(initConf.coords, 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            routeMarkersGroup = L.layerGroup().addTo(map);
            routeLinesGroup = L.layerGroup().addTo(map);
            detailPortalsGroup = L.layerGroup().addTo(map);

            map.on('zoomend', () => {
                evaluateDetailPortalsVisibility();
            });

            map.on('click', function(e) {
                if (!isMapPickingModeActive) return;
                handleMapClickCapture(e.latlng);
            });
        }

        function setupUIEventListeners() {
            const menuBtn = document.getElementById("menuBtn");
            const closeSidebarBtn = document.getElementById("closeSidebarBtn");
            const sidebarOverlay = document.getElementById("sidebarOverlay");
            const streetInput = document.getElementById("streetInput");

            menuBtn.addEventListener("click", openSidebar);
            closeSidebarBtn.addEventListener("click", closeSidebar);
            sidebarOverlay.addEventListener("click", closeSidebar);
            streetInput.addEventListener("input", handleStreetAutocomplete);
            
            document.addEventListener("click", (e) => {
                if (e.target.id !== "streetInput") {
                    document.getElementById("autocompleteList").classList.add("hidden");
                }
            });
        }

        function openSidebar() {
            const sidebar = document.getElementById("sidebar");
            const sidebarOverlay = document.getElementById("sidebarOverlay");
            sidebar.classList.remove("-translate-x-full");
            sidebarOverlay.classList.remove("hidden");
            setTimeout(() => sidebarOverlay.classList.add("opacity-100"), 10);
        }

        function closeSidebar() {
            const sidebar = document.getElementById("sidebar");
            const sidebarOverlay = document.getElementById("sidebarOverlay");
            sidebar.classList.add("-translate-x-full");
            sidebarOverlay.classList.remove("opacity-100");
            setTimeout(() => sidebarOverlay.classList.add("hidden"), 300);
        }

        function activateMapPickerMode() {
            isMapPickingModeActive = true;
            closeSidebar();
            document.getElementById("map").classList.add("map-picking-active");
            
            const toast = document.getElementById("toastMapPicker");
            toast.classList.remove("-translate-y-32", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");
        }

        function handleMapClickCapture(latlng) {
            isMapPickingModeActive = false;
            document.getElementById("map").classList.remove("map-picking-active");
            
            const toast = document.getElementById("toastMapPicker");
            toast.classList.remove("translate-y-0", "opacity-100");
            toast.classList.add("-translate-y-32", "opacity-0");

            document.getElementById("customCoordsInput").value = JSON.stringify([latlng.lat, latlng.lng]);
            document.getElementById("streetInput").value = "Punto marcado en Mapa";
            
            openSidebar();
            document.getElementById("portalInput").focus();
        }

        function switchMunicipality(muniKey) {
            if (!MUNICIPALITIES[muniKey]) return;
            currentMunicipality = muniKey;

            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.remove("bg-white", "dark:bg-gray-700", "shadow-sm", "text-blue-900", "dark:text-white");
                btn.classList.add("text-gray-600", "dark:text-gray-300");
            });

            const activeTab = document.getElementById(`tab-${muniKey}`);
            activeTab.classList.remove("text-gray-600", "dark:text-gray-300");
            activeTab.classList.add("bg-white", "dark:bg-gray-700", "shadow-sm", "text-blue-900", "dark:text-white");

            map.flyTo(MUNICIPALITIES[muniKey].coords, 15, {
                animate: true,
                duration: 1.2
            });

            document.getElementById("routeForm").reset();
            document.getElementById("customCoordsInput").value = "";
        }

        function handleStreetAutocomplete(e) {
            const query = e.target.value.trim();
            const listContainer = document.getElementById("autocompleteList");
            const loadingSpinner = document.getElementById("autocompleteLoading");

            clearTimeout(autocompleteTimeout);

            if (query.length < 3 || query === "Punto marcado en Mapa") {
                listContainer.innerHTML = "";
                listContainer.classList.add("hidden");
                return;
            }

            autocompleteTimeout = setTimeout(async () => {
                loadingSpinner.classList.remove("hidden");
                try {
                    const targetMuni = MUNICIPALITIES[currentMunicipality].name;
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&city=${encodeURIComponent(targetMuni)}&county=Valencia&country=Spain&addressdetails=1&limit=6`;
                    
                    const response = await fetch(url, { headers: { 'Accept-Language': 'es' } });
                    const data = await response.json();

                    listContainer.innerHTML = "";

                    if (!data || data.length === 0) {
                        listContainer.classList.add("hidden");
                        return;
                    }

                    data.forEach(item => {
                        const displayName = item.address.road || item.display_name.split(',')[0];
                        const row = document.createElement("div");
                        row.className = "px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm cursor-pointer border-b border-gray-100 dark:border-gray-700 dark:text-gray-200";
                        row.textContent = displayName;
                        
                        row.addEventListener("click", () => {
                            document.getElementById("streetInput").value = displayName;
                            document.getElementById("customCoordsInput").value = ""; 
                            listContainer.classList.add("hidden");
                        });
                        listContainer.appendChild(row);
                    });

                    listContainer.classList.remove("hidden");
                } catch (error) {
                    console.error(error);
                } finally {
                    loadingSpinner.classList.add("hidden");
                }
            }, 400);
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById("submitBtn");
            const streetName = document.getElementById("streetInput").value.trim();
            const portalNum = parseInt(document.getElementById("portalInput").value);
            const sidewalk = document.getElementById("sidewalkInput").value;
            const customCoordsRaw = document.getElementById("customCoordsInput").value;

            let geoPoint = null;
            submitBtn.disabled = true;

            if (customCoordsRaw) {
                geoPoint = JSON.parse(customCoordsRaw);
            } else {
                try {
                    const targetMuni = MUNICIPALITIES[currentMunicipality].name;
                    const searchQueries = [
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(streetName)}+${portalNum}&city=${encodeURIComponent(targetMuni)}&county=Valencia&country=Spain&limit=1`,
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(streetName)}&city=${encodeURIComponent(targetMuni)}&county=Valencia&country=Spain&limit=1`
                    ];

                    for (let url of searchQueries) {
                        const res = await fetch(url);
                        const data = await res.json();
                        if (data && data.length > 0) {
                            geoPoint = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                            break;
                        }
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            if (!geoPoint) {
                alert(`No se ha encontrado "${streetName}". Usa el botón naranja para marcarlo con el dedo.`);
                submitBtn.disabled = false;
                return;
            }

            const routeSegment = {
                id: Date.now(),
                municipality: currentMunicipality,
                street: streetName,
                portal: portalNum,
                sidewalk: sidewalk,
                coords: geoPoint
            };

            activeRouteData.push(routeSegment);
            saveStateToLocalStorage();
            renderActiveRoute();

            document.getElementById("routeForm").reset();
            document.getElementById("customCoordsInput").value = "";
            submitBtn.disabled = false;
            closeSidebar();

            map.panTo(geoPoint);
        }

        function renderActiveRoute() {
            routeMarkersGroup.clearLayers();
            routeLinesGroup.clearLayers();
            detailPortalsGroup.clearLayers();

            const listContainer = document.getElementById("liveRouteList");
            listContainer.innerHTML = "";

            if (activeRouteData.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-2">No hay tramos cargados en la jornada.</p>`;
                return;
            }

            const polylinePoints = [];

            activeRouteData.forEach((segment, index) => {
                const stepNumber = index + 1;
                polylinePoints.push(segment.coords);

                const customIcon = L.divIcon({
                    className: 'route-idx-marker',
                    html: `<span>${stepNumber}</span>`, 
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                const marker = L.marker(segment.coords, { icon: customIcon })
                    .bindPopup(`<b>Tramo #${stepNumber}</b><br>${segment.street}, No. ${segment.portal}<br>Acera: ${segment.sidewalk.toUpperCase()}`);
                routeMarkersGroup.addLayer(marker);

                generateMicroPortals(segment.coords, segment.portal, segment.sidewalk);

                const row = document.createElement("div");
                row.className = "flex items-center justify-between p-2.5 bg-gray-100 dark:bg-gray-800 rounded-lg border-l-4 border-blue-900 dark:border-blue-500";
                row.innerHTML = `
                    <div class="text-xs">
                        <p class="font-bold dark:text-white">${stepNumber}. ${segment.street}</p>
                        <p class="text-gray-500 dark:text-gray-400">Portal: ${segment.portal} • Acera: ${segment.sidewalk}</p>
                    </div>
                    <button onclick="removeSegment(${segment.id})" class="text-red-500 p-1 hover:bg-gray-200 dark:hover:bg-gray-700 rounded">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                listContainer.appendChild(row);
            });

            if (polylinePoints.length > 1) {
                const polyline = L.polyline(polylinePoints, {
                    color: '#1e3a8a',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '8, 12',
                    lineJoin: 'round'
                });
                routeLinesGroup.addLayer(polyline);
            }

            evaluateDetailPortalsVisibility();
        }

        function generateMicroPortals(centerCoords, startPortal, sidewalkMode) {
            const numPortalsToSimulate = 6;
            for (let i = 0; i < numPortalsToSimulate; i++) {
                let currentNum = startPortal + i;
                
                if (sidewalkMode === 'pares' && currentNum % 2 !== 0) continue;
                if (sidewalkMode === 'impares' && currentNum % 2 === 0) continue;

                const latShift = (i * 0.00015);
                const lngShift = (currentNum % 2 === 0 ? 0.0002 : -0.0002);
                const portalColor = (currentNum % 2 === 0) ? '#22c55e' : '#ef4444';

                const circleMarker = L.circleMarker([centerCoords[0] + latShift, centerCoords[1] + lngShift], {
                    radius: 6,
                    fillColor: portalColor,
                    color: '#ffffff',
                    weight: 1.5,
                    fillOpacity: 0.9
                }).bindTooltip(`Portal ${currentNum}`, { permanent: false, direction: 'top' });

                detailPortalsGroup.addLayer(circleMarker);
            }
        }

        function evaluateDetailPortalsVisibility() {
            if (map.getZoom() >= 17) {
                if (!map.hasLayer(detailPortalsGroup)) map.addLayer(detailPortalsGroup);
            } else {
                if (map.hasLayer(detailPortalsGroup)) map.removeLayer(detailPortalsGroup);
            }
        }

        function removeSegment(id) {
            activeRouteData = activeRouteData.filter(s => s.id !== id);
            saveStateToLocalStorage();
            renderActiveRoute();
        }

        function toggleNightMode() {
            const isDark = document.getElementById("nightModeToggle").checked;
            const mapContainer = document.getElementById("map");
            if (isDark) {
                document.documentElement.classList.add("dark");
                mapContainer.classList.add("dark-mode-map");
            } else {
                document.documentElement.classList.remove("dark");
                mapContainer.classList.remove("dark-mode-map");
            }
        }

        function saveStateToLocalStorage() {
            localStorage.setItem("amailia_active_route", JSON.stringify(activeRouteData));
            localStorage.setItem("amailia_current_muni", currentMunicipality);
        }

        function loadStateFromLocalStorage() {
            const savedRoute = localStorage.getItem("amailia_active_route");
            const savedMuni = localStorage.getItem("amailia_current_muni");
            if (savedRoute) activeRouteData = JSON.parse(savedRoute);
            if (savedMuni) {
                currentMunicipality = savedMuni;
                switchMunicipality(currentMunicipality);
            }
        }

        function archiveCurrentJob() {
            if (activeRouteData.length === 0) {
                alert("No hay datos en la jornada actual para archivar.");
                return;
            }
            let history = JSON.parse(localStorage.getItem("amailia_history") || "[]");
            history.push({ date: new Date().toISOString(), data: activeRouteData });
            localStorage.setItem("amailia_history", JSON.stringify(history));
            activeRouteData = [];
            saveStateToLocalStorage();
            renderActiveRoute();
            alert("Jornada guardada con éxito.");
        }

        function triggerBackup() {
            const backupPayload = {
                activeRoute: activeRouteData,
                history: JSON.parse(localStorage.getItem("amailia_history") || "[]"),
                exportedAt: new Date().toISOString()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `amailia_v4_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerRestore() {
            document.getElementById("importFileInput").click();
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.activeRoute && importedData.history) {
                        activeRouteData = importedData.activeRoute;
                        localStorage.setItem("amailia_history", JSON.stringify(importedData.history));
                        saveStateToLocalStorage();
                        renderActiveRoute();
                        alert("Copia de seguridad restaurada.");
                    } else {
                        alert("Formato inválido.");
                    }
                } catch (err) {
                    alert("Error al importar.");
                }
            };
            reader.readAsText(file);
        }

        async function checkUpdateOTA() {
            try {
                const currentLoc = window.location.href.split('?')[0];
                const response = await fetch(`${currentLoc}?cb=${Date.now()}`, { method: 'HEAD' });
                const serverEtag = response.headers.get("ETag");
                const serverLastModified = response.headers.get("Last-Modified");
                const localSignature = localStorage.getItem("amailia_ota_signature");
                const currentServerSignature = serverEtag || serverLastModified;

                if (!currentServerSignature) return;
                if (localSignature && localSignature !== currentServerSignature) {
                    if (confirm("¿Actualizar a la última versión disponible?")) {
                        localStorage.setItem("amailia_ota_signature", currentServerSignature);
                        window.location.reload(true);
                    }
                } else {
                    localStorage.setItem("amailia_ota_signature", currentServerSignature);
                    alert("AmailIA está actualizada.");
                }
            } catch (error) {
                console.log(error);
            }
        }
    </script>
</body>
</html>

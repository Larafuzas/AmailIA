<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AmailIA - Optimización de Reparto (v7.4.0)</title>
    
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icono.png">
    <meta name="apple-mobile-web-app-title" content="AmailIA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body { touch-action: pan-x pan-y; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .dark .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        .route-idx-marker {
            background-color: #1e3a8a; color: #ffffff; border: 2px solid #ffffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background-color 0.3s ease;
        }
        
        .route-idx-marker-car { background-color: #8b5cf6; } 

        .route-idx-marker.estado-paquete { background-color: #eab308; color: #000000; border-color: #ffffff; }
        .route-idx-marker.estado-entregado { background-color: #10b981; color: #ffffff; opacity: 0.85; border-color: #ffffff; }
        .route-idx-marker.estado-error { background-color: #ef4444; color: #ffffff; border-color: #ffffff; }

        .history-idx-marker {
            background-color: #dc2626; color: #ffffff; border: 2px solid #ffffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .map-picking-active { cursor: crosshair !important; }
        .nav-item { transition: all 0.2s ease; }
        .nav-item.active { color: #1e3a8a; }
        .dark .nav-item.active { color: #60a5fa; }
        #bottom-sheet { transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #printTableContainer { display: none; }

        @media print {
            #bottom-sheet, #bottom-nav, #toastMapPicker, #mapFilterSelector, .leaflet-control-zoom, #exitHistoryBtn, #barriosModal { display: none !important; }
            #map-wrapper { height: 45vh !important; flex: none !important; position: relative !important; }
            #printTableContainer { display: block !important; width: 100% !important; margin-top: 20px; font-family: Arial, sans-serif; color: #000; }
            body { background: #fff !important; color: #000 !important; overflow: visible !important; display: block !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; border: 1px solid #ddd; padding: 8px; font-size: 12px; text-align: left; }
            td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full overflow-hidden bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 select-none">

    <!-- VISOR DE MAPAS DE BARRIOS (MODAL FLOTANTE NATIVO) -->
    <div id="barriosModal" class="fixed inset-0 bg-black z-[1000] hidden flex-col touch-none">
        <div class="absolute top-0 right-0 left-0 p-4 flex justify-end z-50 bg-gradient-to-b from-black/70 to-transparent pt-safe">
            <button onclick="closeBarrio()" class="bg-white/20 backdrop-blur text-white p-2.5 rounded-full active:scale-95 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="barriosZoomContainer" class="flex-1 overflow-hidden relative flex items-center justify-center h-full w-full">
            <img id="barriosImg" src="" alt="Mapa Barrio" class="max-w-full max-h-full object-contain origin-center transform-gpu" style="transform: scale(1) translate(0px, 0px);">
        </div>
    </div>

    <div id="map-wrapper" class="flex-1 relative z-0 w-full">
        <div class="absolute top-0 left-0 right-0 h-28 bg-gradient-to-b from-black/50 to-transparent z-[400] pointer-events-none"></div>
        <div id="map" class="h-full w-full"></div>

        <div id="mapFilterSelector" class="absolute right-4 z-[400] flex flex-col gap-1 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md p-1.5 rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 transition-all" style="top: calc(75px + env(safe-area-inset-top));">
            <button onclick="setMapFilter('T')" id="filter-T" class="w-8 h-8 rounded-lg font-bold text-xs bg-blue-600 text-white shadow-sm transition-all" aria-label="Todas">T</button>
            <button onclick="setMapFilter('N')" id="filter-N" class="w-8 h-8 rounded-lg font-bold text-xs text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 transition-all" aria-label="Notificaciones">N</button>
            <button onclick="setMapFilter('P')" id="filter-P" class="w-8 h-8 rounded-lg font-bold text-xs text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 transition-all" aria-label="Paquetería">P</button>
        </div>
        
        <div id="toastMapPicker" class="absolute top-12 left-1/2 transform -translate-x-1/2 z-[400] bg-blue-950 text-white px-4 py-2 rounded-full shadow-lg flex items-center space-x-2 opacity-0 transition-opacity duration-300 pointer-events-none">
            <span class="flex h-3 w-3 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
            <p class="text-xs font-semibold">Toca el mapa para situar tramo</p>
        </div>

        <button id="exitHistoryBtn" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-[400] bg-red-600 text-white font-bold px-4 py-2 rounded-xl shadow-2xl flex items-center space-x-2 border border-red-500 active:scale-95 transition-all hidden animate-bounce">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" /></svg>
            <span class="text-xs tracking-wider uppercase">Salir Histórico</span>
        </button>
    </div>

    <div id="bottom-sheet" class="bg-white dark:bg-gray-900 rounded-t-3xl shadow-[0_-15px_40px_rgba(0,0,0,0.15)] z-40 w-full flex flex-col border-t border-gray-200 dark:border-gray-800 h-[60dvh]">
        <div class="w-full flex justify-center pt-3 pb-2 shrink-0 cursor-pointer" onclick="switchTab('mapa')">
            <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full"></div>
        </div>

        <div id="view-ruta" class="tab-content flex-1 overflow-y-auto px-4 pb-4 space-y-4 hidden">
            <div class="grid grid-cols-3 gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl shrink-0">
                <button onclick="switchMunicipality('catarroja')" id="tab-catarroja" class="tab-btn py-2 text-xs font-bold rounded-lg transition-all bg-white dark:bg-gray-700 shadow-sm text-blue-900 dark:text-white">Catarroja</button>
                <button onclick="switchMunicipality('albal')" id="tab-albal" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-500 dark:text-gray-400">Albal</button>
                <button onclick="switchMunicipality('massanassa')" id="tab-massanassa" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-500 dark:text-gray-400">Massanassa</button>
            </div>

            <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl border border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Añadir Tramos</span>
                    <button type="button" onclick="activateMapPickerMode()" class="text-[10px] bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-1 px-2 rounded flex items-center space-x-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></svg>
                        <span>En Mapa</span>
                    </button>
                </div>

                <div class="flex bg-gray-200 dark:bg-gray-700 rounded-lg p-1 mb-3">
                    <button type="button" onclick="setTipoIngreso('notificacion')" id="btn-tipo-notificacion" class="flex-1 py-1.5 text-xs font-bold bg-white dark:bg-gray-600 rounded-md shadow-sm text-blue-800 dark:text-blue-300 transition-all">✉️ Notificaciones</button>
                    <button type="button" onclick="setTipoIngreso('paquete')" id="btn-tipo-paquete" class="flex-1 py-1.5 text-xs font-bold text-gray-500 dark:text-gray-400 rounded-md transition-all">📦 Paquetería</button>
                </div>

                <form id="routeForm" onsubmit="handleFormSubmit(event)" class="space-y-2 relative">
                    <input type="hidden" id="customCoordsInput" value="">
                    <input type="text" id="streetInput" autocomplete="off" placeholder="Calle o Plaza" class="w-full px-3 py-2 text-sm bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-600 dark:text-white" required>
                    <div id="autocompleteList" class="absolute top-20 left-0 right-0 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl max-h-40 overflow-y-auto hidden z-50"></div>
                    
                    <div class="flex space-x-2">
                        <input type="text" id="portalInput" placeholder="Portal (Lotes: 21,25)" class="flex-1 px-3 py-2 text-sm bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-600 dark:text-white" required>
                        <button type="submit" id="submitBtn" class="bg-blue-900 hover:bg-blue-800 text-white font-bold px-4 py-2 rounded-lg shadow flex items-center justify-center shrink-0">
                            <span class="text-xs">Añadir</span>
                        </button>
                    </div>
                </form>
            </div>

            <div>
                <div class="flex space-x-2 mb-2">
                    <div class="flex bg-gray-200 dark:bg-gray-700 rounded-lg p-0.5 justify-between">
                        <button onclick="setRoutingMode('foot')" id="btn-mode-foot" class="px-3 flex justify-center py-1 bg-white dark:bg-gray-600 rounded-md shadow-sm text-blue-600 dark:text-blue-400 transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path></svg>
                        </button>
                        <button onclick="setRoutingMode('car')" id="btn-mode-car" class="px-3 flex justify-center py-1 text-gray-500 dark:text-gray-400 rounded-md transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"></path></svg>
                        </button>
                    </div>
                    <button onclick="optimizeRouteLocalTSP()" id="tspOptimizeBtn" class="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-lg shadow-sm text-xs active:scale-[0.98]">Optimizar</button>
                    <button onclick="invertirSentidoRutaCompleta()" class="flex-1 bg-purple-700 text-white font-bold py-2 rounded-lg shadow-sm text-xs active:scale-[0.98]">Invertir</button>
                </div>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Secuencia Mostrada <span id="routeCountBadge" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-1.5 py-0.5 rounded ml-1">0</span></span>
                    <button onclick="syncPendingCoordinates()" id="syncQueueBtn" class="hidden text-[10px] bg-amber-500 text-slate-950 font-bold px-2 py-1 rounded animate-pulse">Sincronizar</button>
                </div>
                <div id="liveRouteList" class="space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <div id="view-historial" class="tab-content flex-1 overflow-y-auto px-4 pb-4 space-y-4 hidden">
            <button onclick="archiveCurrentJob()" class="w-full bg-emerald-600 text-white text-xs font-bold py-3 rounded-xl shadow mt-2">Archivar Jornada Actual</button>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Histórico Guardado</label>
                <div id="historyFilesContainer" class="space-y-2"></div>
            </div>
        </div>

        <div id="view-ajustes" class="tab-content flex-1 overflow-y-auto px-4 pb-4 space-y-5 hidden">
            <div class="mt-2">
                <button onclick="ejecutarImpresionJornada()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md text-xs flex justify-center items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.82l-.24 2.11A1.23 1.23 0 007.71 17.3h8.58a1.23 1.23 0 001.23-1.37l-.24-2.11M6.72 13.82a3.68 3.33 0 0110.56 0M6.72 13.82H4.47a1.23 1.23 0 00-1.23 1.23v2.45a1.23 1.23 0 001.23 1.23h1.23M17.28 13.82h2.25a1.23 1.23 0 011.23 1.23v2.45a1.23 1.23 0 01-1.23 1.23h-1.23M16.5 6.75H7.5v4.5h9v-4.5z" /></svg>
                    <span>Imprimir Hoja de Ruta</span>
                </button>
            </div>

            <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl border border-gray-200 dark:border-gray-700 space-y-3">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Datos Offline</label>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-medium dark:text-gray-300">Calles y Plazas</span>
                    <span id="dbSizeBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-gray-200 dark:bg-gray-700">Vacío</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="downloadCallejeroOverpass()" class="text-xs bg-blue-900 text-white py-2 rounded-lg font-semibold">Bajar Datos</button>
                    <button onclick="clearCallejeroLocal()" class="text-xs bg-gray-200 dark:bg-gray-700 text-red-600 py-2 rounded-lg font-semibold">Borrar</button>
                </div>
                <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
                    <button onclick="downloadMapTilesOffline()" id="btnDownloadMap" class="w-full text-xs bg-teal-700 text-white py-2 rounded-lg font-semibold">Caché Plano (Nivel 14-17)</button>
                </div>
            </div>

            <!-- SECCIÓN NUEVA: MAPAS DE BARRIOS -->
            <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl border border-gray-200 dark:border-gray-700 space-y-3">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Barrios</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="openBarrio('catarroja')" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 py-2 rounded-lg font-bold shadow-sm dark:text-white">Catarroja</button>
                    <button onclick="openBarrio('albal')" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 py-2 rounded-lg font-bold shadow-sm dark:text-white">Albal</button>
                    <button onclick="openBarrio('massanassa')" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 py-2 rounded-lg font-bold shadow-sm dark:text-white">Massanassa</button>
                </div>
            </div>

            <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl border border-gray-200 dark:border-gray-700 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold dark:text-gray-300">Modo Noche</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="nightModeToggle" onchange="toggleNightMode()" class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
                <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="triggerBackup()" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 py-2 rounded-lg font-bold">Exportar JSON</button>
                        <button onclick="triggerRestore()" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 py-2 rounded-lg font-bold">Importar JSON</button>
                    </div>
                </div>
                <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
                    <button onclick="checkUpdateOTA()" class="w-full bg-gray-900 dark:bg-gray-950 text-white text-[11px] font-mono py-2 rounded-lg flex items-center justify-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                        <span>Comprobar OTA (v7.4.0)</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <nav id="bottom-nav" class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 z-50 shrink-0 flex justify-around items-center px-2 pt-2.5 pb-[max(env(safe-area-inset-bottom),0.75rem)]">
        <button onclick="switchTab('mapa')" id="nav-mapa" class="nav-item active flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
            <span class="text-[11px] font-semibold">Mapa</span>
        </button>
        <button onclick="switchTab('ruta')" id="nav-ruta" class="nav-item flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span class="text-[11px] font-semibold">Ruta</span>
        </button>
        <button onclick="switchTab('historial')" id="nav-historial" class="nav-item flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[11px] font-semibold">Historial</span>
        </button>
        <button onclick="switchTab('ajustes')" id="nav-ajustes" class="nav-item flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="text-[11px] font-semibold">Ajustes</span>
        </button>
    </nav>

    <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="handleImportFile(event)">

    <script>
        const APP_VERSION = "7.4.0";
        const MUNICIPALITIES = {
            catarroja: { name: "Catarroja", cp: "46470", coords: [39.4031, -0.4024] },
            albal: { name: "Albal", cp: "46470", coords: [39.3958, -0.4154] },
            massanassa: { name: "Massanassa", cp: "46460", coords: [39.4125, -0.3997] }
        };

        let currentMunicipality = 'catarroja';
        let routingMode = 'foot'; 
        let currentTipoIngreso = 'notificacion';
        let currentMapFilter = 'T'; 
        
        let map = null, mapTileLayer;
        let activeRouteData = []; 
        let routeMarkersGroup, routeLinesGroup, historyLayersGroup;

            else if(e.touches.length === 1 && zS > 1) { isP = true; sX = e.touches[0].pageX - zPx; sY = e.touches[0].pageY - zPy; }

        zC.addEventListener('touchmove', e => {

                zS = Math.min(Math.max(1, zS * (cD / iD)), 6); iD = cD; updateZ();

        async function syncPendingCoordinates() {

        function handleOptimizeClick() { optimizeRouteLocalTSP(); }
        function calculateHaversineDistance(c1, c2) {
            const R = 6371e3; const lat1 = c1[0] * Math.PI / 180; const lat2 = c2[0] * Math.PI / 180;
            const a = Math.sin((c2[0] - c1[0]) * Math.PI / 180 / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin((c2[1] - c1[1]) * Math.PI / 180 / 2) ** 2;
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))); 
        }

        function optimizeRouteLocalTSP() {
            const valid = activeRouteData.filter(s => !s.pendingSync);
            if (valid.length < 2) return alert("Introduce 2 tramos sincronizados.");
            let callesMap = {}; 
            
            valid.forEach(t => { 
                let key = t.street.trim().toLowerCase(); 
                if (!callesMap[key]) callesMap[key] = []; 
                callesMap[key].push(t); 
            });

            for (let c in callesMap) callesMap[c].sort((a, b) => a.portal - b.portal);
            let restantes = Object.keys(callesMap); let ruta = [];
            let key = restantes.shift(); let lista = callesMap[key]; ruta = ruta.concat(lista);
            let ult = lista[lista.length - 1];

            while (restantes.length > 0) {
                let idx = 0, minD = Infinity, normal = true;
                for (let i = 0; i < restantes.length; i++) {
                    let cand = callesMap[restantes[i]];
                    let dIni = calculateHaversineDistance(ult.coords, cand[0].coords);
                    let dFin = calculateHaversineDistance(ult.coords, cand[cand.length - 1].coords);
                    if (dIni < minD) { minD = dIni; idx = i; normal = true; }
                    if (dFin < minD) { minD = dFin; idx = i; normal = false; }
                }
                let kProx = restantes.splice(idx, 1)[0]; let blq = callesMap[kProx];
                if (!normal) blq.reverse();
                ruta = ruta.concat(blq); ult = blq[blq.length - 1];
            }

            activeRouteData = [...ruta, ...activeRouteData.filter(s => s.pendingSync)];
            saveStateToLocalStorage(); renderActiveRoute(); map.fitBounds(ruta.map(s => s.coords), { padding: [40, 40] }); switchTab('mapa');
        }

        async function downloadMapTilesOffline() {
            if (!('caches' in window)) return alert("Cache API no soportada.");
            if (!navigator.onLine) return alert("Conecta a internet primero.");
            const bounds = map.getBounds(); const btn = document.getElementById("btnDownloadMap");
            const orig = btn.innerText; btn.innerText = "Calculando..."; btn.disabled = true;
            const lon2tile = (lon, z) => (Math.floor((lon + 180) / 360 * Math.pow(2, z)));
            const lat2tile = (lat, z) => (Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z)));
            let urls = [];
            [14, 15, 16, 17].forEach(z => {
                for (let x = lon2tile(bounds.getWest(), z); x <= lon2tile(bounds.getEast(), z); x++) {
                    for (let y = lat2tile(bounds.getNorth(), z); y <= lat2tile(bounds.getSouth(), z); y++) {
                        urls.push(`https://${['a','b','c'][Math.floor(Math.random()*3)]}.tile.openstreetmap.org/${z}/${x}/${y}.png`);
                    }
                }
            });
            if(urls.length > 500 && !confirm(`¿Descargar ${urls.length} teselas?`)) { btn.innerText = orig; btn.disabled = false; return; }
            btn.innerText = `0/${urls.length}`; let c = 0;
            try {
                const cache = await caches.open('amailia-maptiles');
                for (let i = 0; i < urls.length; i += 10) {
                    await Promise.all(urls.slice(i, i+10).map(async u => {
                        try { const res = await fetch(u, {mode:'cors'}); if(res.ok) await cache.put(u, res); } catch(e){} c++;
                    }));
                    btn.innerText = `${c}/${urls.length}`;
                }
                btn.innerText = "¡Listo!"; setTimeout(() => btn.innerText = orig, 3000);
            } catch(e) { alert("Error"); btn.innerText = orig; }
            btn.disabled = false;
        }

        async function downloadCallejeroOverpass() {

                const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
                const data = await res.json(); const vias = new Set();
                data.elements.forEach(el => { if (el.tags && el.tags.name) vias.add(el.tags.name.trim()); });
                localStorage.setItem(`amailia_db_vias_${currentMunicipality}`, JSON.stringify(Array.from(vias).sort()));

            } catch (err) { alert("Error al bajar calles."); }
        }

        function updateCallejeroStatusUI() {
            const data = localStorage.getItem(`amailia_db_vias_${currentMunicipality}`);
            const b = document.getElementById("dbSizeBadge");
            if(data) { b.textContent = `${JSON.parse(data).length} calles`; b.className = "text-[10px] px-2 py-0.5 rounded bg-green-600 text-white"; }
            else { b.textContent = "Vacío"; b.className = "text-[10px] px-2 py-0.5 rounded bg-red-600 text-white"; }
        }
        document.getElementById("streetInput").addEventListener("input", (e) => {
            const q = e.target.value.toLowerCase(); const list = document.getElementById("autocompleteList");
            if(q.length < 3) return list.classList.add("hidden");
            const data = localStorage.getItem(`amailia_db_vias_${currentMunicipality}`); if(!data) return;
            const calles = JSON.parse(data).filter(c => c.toLowerCase().includes(q)).slice(0, 5);
            list.innerHTML = "";
            calles.forEach(c => {
                const div = document.createElement("div"); div.className = "px-3 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer dark:text-gray-200 border-b border-gray-100 dark:border-gray-700";
                div.innerText = c; div.onclick = () => { document.getElementById("streetInput").value = c; list.classList.add("hidden"); document.getElementById("portalInput").focus(); };
                list.appendChild(div);
            });
            calles.length > 0 ? list.classList.remove("hidden") : list.classList.add("hidden");
        });

        function ejecutarImpresionJornada() {
            if (activeRouteData.length === 0) return alert("Sin datos.");
            document.getElementById("printMetaLabel").textContent = `Fecha: ${new Date().toLocaleDateString('es-ES')} | Tramos: ${activeRouteData.length}`;
            const tbody = document.getElementById("printTableBody"); tbody.innerHTML = "";
            activeRouteData.forEach((s, i) => {
                let tipoIcon = s.tipo === 'paquete' ? '📦' : '✉️';
                let estadoTxt = '';
                if(s.estado === 'entregado') estadoTxt = '✅';
                if(s.estado === 'error') estadoTxt = '❌';
                const tr = document.createElement("tr");
                tr.innerHTML = `<td style="text-align: center; font-weight: bold;">${i + 1}</td><td>${MUNICIPALITIES[s.municipality].name}</td><td style="font-weight: bold;">${tipoIcon} ${s.street}</td><td style="text-align: center; font-weight: bold;">${s.portal}</td><td style="text-align: center;">${estadoTxt}</td>`;
                tbody.appendChild(tr);
            });
            setTimeout(() => window.print(), 350);
        }

        async function triggerBackup() {
            const backupData = JSON.stringify({ activeRoute: activeRouteData, history: JSON.parse(localStorage.getItem("amailia_history") || "[]") });
            const fileName = `amailia_v${APP_VERSION}_backup.json`;
            if (navigator.share && navigator.canShare) {
                try {
                    const file = new File([backupData], fileName, { type: "application/json" });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'Backup AmailIA', text: 'Copia de seguridad de rutas y paquetería' });
                        return;
                    }
                } catch (err) {}
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(backupData);
            const a = document.createElement('a'); a.href = dataStr; a.download = fileName; a.click();
        }

        function triggerRestore() { document.getElementById("importFileInput").click(); }
        function handleImportFile(e) {
            const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const d = JSON.parse(e.target.result);
                    if (d.activeRoute && d.history) { activeRouteData = d.activeRoute; localStorage.setItem("amailia_history", JSON.stringify(d.history)); saveStateToLocalStorage(); renderActiveRoute(); renderHistoryFileList(); alert("Backup cargado."); }
                } catch(err) { alert("Error JSON."); }
            }; reader.readAsText(file);
        }
        async function checkUpdateOTA() {
            try {
                const res = await fetch(`${window.location.href.split('?')[0]}?cb=${Date.now()}`, { method: 'HEAD' });
                const sig = res.headers.get("ETag") || res.headers.get("Last-Modified");
                const local = localStorage.getItem("amailia_ota");
                if (local && local !== sig) { if (confirm("¿Actualizar?")) { localStorage.setItem("amailia_ota", sig); window.location.reload(true); } } 
                else { localStorage.setItem("amailia_ota", sig); alert(`Actualizado (v${APP_VERSION})`); }
            } catch (e) { console.log("OTA local."); }
        }

        function toggleNightMode() { const isDark = document.getElementById("nightModeToggle").checked; document.documentElement.classList.toggle("dark", isDark); }
        function saveStateToLocalStorage() { localStorage.setItem("amailia_active_route", JSON.stringify(activeRouteData)); }
        function loadStateFromLocalStorage() { const r = localStorage.getItem("amailia_active_route"); const m = localStorage.getItem("amailia_current_muni"); if(r) activeRouteData = JSON.parse(r); if(m) switchMunicipality(m); }
    </script>
</body>
</html>

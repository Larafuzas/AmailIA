<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmailIA - Geolocalización de Reparto v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        /* Estilos personalizados para inputs y botones */
        .sidebar-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .sidebar-input:focus { border-color: #3b82f6; ring: 2px #93c5fd; }
        .plus-btn {
            background-color: #3b82f6;
            color: white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .plus-btn:hover { background-color: #2563eb; }
        .plus-btn svg { width: 24px; height: 24px; fill: white; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <aside class="w-80 bg-white shadow-xl flex flex-col p-6 z-20">
        <div class="flex items-center gap-3 mb-8">
            <div class="p-1 rounded-xl bg-gray-900 shadow-inner">
                <svg class="w-12 h-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 25 L55 55 L85 35" stroke="#0A2351" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M25 80 L55 55 L75 85" stroke="#0A2351" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 55 L90 55" stroke="#0A2351" stroke-width="6" stroke-linecap="round"/>
                    <path d="M40 15 L55 55 L55 90" stroke="#0A2351" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="55" cy="55" r="9" fill="#ffffff" stroke="#0A2351" stroke-width="4" />
                    <circle cx="25" cy="80" r="5" fill="#0A2351" />
                    <circle cx="85" cy="35" r="5" fill="#0A2351" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-gray-950">AmailIA</h1>
                <p class="text-xs text-gray-600">Horta Sud · Valencia</p>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-[11px] font-semibold uppercase text-gray-500 mb-1.5">Municipio Activo</label>
            <select id="municipio" class="sidebar-input">
                <option value="catarroja">Catarroja</option>
                <option value="albal">Albal</option>
                <option value="massanassa">Massanassa</option>
            </select>
        </div>

        <div class="mb-6">
            <h2 class="text-base font-bold text-gray-900 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
                Registrar Tramo de Calle
            </h2>
            <div class="space-y-4">
                <input type="text" id="calle" placeholder="Nombre de la Vía / Calle" class="sidebar-input">
                <input type="number" id="pto_inicio" placeholder="Pto. Inicio (Nº)" class="sidebar-input">
                <select id="acera" class="sidebar-input">
                    <option value="pares">Solo Pares</option>
                    <option value="impares">Solo Impares</option>
                    <option value="ambas">Ambas</option>
                </select>
                <div class="flex justify-center mt-6">
                    <button id="add-tramo" class="plus-btn">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4v16m8-8H4" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col mt-4">
            <h2 class="text-base font-bold text-gray-900 mb-3 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-.101l-3.823 1.913a1.242 1.242 0 01-1.112 0L9.171 4.778a1.242 1.242 0 00-1.112 0L3.184 7.214c-.381.19-.622.58-.622 1.006v11.412c0 .836.88 1.38 1.628.101l3.823-1.913a1.242 1.242 0 011.112 0l3.823 1.913c.348.174.754.174 1.102 0z"/></svg>
                Secuencia de Ruta Activa
            </h2>
            <div id="ruta-activa" class="flex-1 space-y-2 overflow-y-auto text-sm text-gray-700 italic pr-2">
                No hay tramos registrados para hoy.
            </div>
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button id="clear-map" class="text-xs font-semibold py-2.5 px-4 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-50">Limpiar Mapa</button>
                <button id="archive-day" class="text-xs font-semibold py-2.5 px-4 rounded-xl bg-gray-900 text-white hover:bg-black">Archivar Jornada</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 h-screen z-10">
        <div id="map"></div>
    </main>

    <script>
        // Coordenadas centrales de los municipios
        const coords = {
            catarroja: [39.4031, -0.4024],
            albal: [39.3958, -0.4154],
            massanassa: [39.4125, -0.3997]
        };

        // Inicializar Mapa Leaflet
        const map = L.map('map').setView(coords.catarroja, 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Capas para dibujar los tramos registrados
        let layerGroup = L.layerGroup().addTo(map);
        let currentRoute = [];

        // Cambiar municipio
        document.getElementById('municipio').addEventListener('change', (e) => {
            const municipio = e.target.value;
            map.flyTo(coords[municipio], 15);
        });

        // Simulación de portales y sentidos para un municipio (Catarroja)
        const simData = {
            'Calle Mayor': {
                sentido: 1, // 1 creciente, -1 decreciente
                portales: [
                    {n: 10, c: [39.4029, -0.4036], acera: 'pares'},
                    {n: 12, c: [39.4031, -0.4034], acera: 'pares'},
                    {n: 14, c: [39.4033, -0.4032], acera: 'pares'},
                    {n: 16, c: [39.4035, -0.4030], acera: 'pares'},
                    {n: 11, c: [39.4030, -0.4037], acera: 'impares'},
                    {n: 13, c: [39.4032, -0.4035], acera: 'impares'},
                    {n: 15, c: [39.4034, -0.4033], acera: 'impares'},
                    {n: 17, c: [39.4036, -0.4031], acera: 'impares'}
                ]
            }
        };

        // Añadir tramo al mapa y a la lista
        document.getElementById('add-tramo').addEventListener('click', () => {
            const calle = document.getElementById('calle').value;
            const ptoInicio = document.getElementById('pto_inicio').value;
            const acera = document.getElementById('acera').value;

            if (!calle || !ptoInicio) return;

            // Datos de simulación para mostrar funcionalidad
            const data = simData[calle] || simData['Calle Mayor'];
            
            // Dibujar tramos pares (verde) o impares (rojo) con flechas
            layerGroup.clearLayers();
            currentRoute = [];

            if (acera === 'pares' || acera === 'ambas') {
                const parPoints = data.portales.filter(p => p.acera === 'pares').map(p => p.c);
                L.polyline(parPoints, {color: 'green', weight: 4, dashArray: '10, 10'}).addTo(layerGroup);
                parPoints.forEach(c => L.circle(c, {radius: 3, color: 'green', fill: true}).addTo(layerGroup));
            }

            if (acera === 'impares' || acera === 'ambas') {
                const imparPoints = data.portales.filter(p => p.acera === 'impares').map(p => p.c);
                L.polyline(imparPoints, {color: 'red', weight: 4, dashArray: '10, 10'}).addTo(layerGroup);
                imparPoints.forEach(c => L.circle(c, {radius: 3, color: 'red', fill: true}).addTo(layerGroup));
            }

            // Añadir etiquetas con números y flecha de sentido
            data.portales.forEach(p => {
                const color = p.acera === 'pares' ? 'green' : 'red';
                const label = L.divIcon({className: `bg-white px-1.5 py-0.5 rounded text-xs font-semibold text-${color}-800 border`, html: p.n});
                L.marker(p.c, {icon: label}).addTo(layerGroup);
            });

            // Actualizar Ruta Activa
            const ruta = document.getElementById('ruta-activa');
            if (currentRoute.length === 0) ruta.innerHTML = '';
            currentRoute.push(`1. ${calle}, ${ptoInicio}, ${acera.toUpperCase()}`);
            ruta.innerHTML = currentRoute.join('<br>');

            // Limpiar inputs
            document.getElementById('calle').value = '';
            document.getElementById('pto_inicio').value = '';
        });

        document.getElementById('clear-map').addEventListener('click', () => {
            layerGroup.clearLayers();
            document.getElementById('ruta-activa').innerHTML = 'No hay tramos registrados para hoy.';
        });
    </script>
</body>
</html>

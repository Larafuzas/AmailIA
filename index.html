<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AmailIA - Optimización de Reparto (v6.6.0)</title>
    
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icono.png">
    <meta name="apple-mobile-web-app-title" content="AmailIA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body { touch-action: pan-x pan-y; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }

        .dark .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        /* ESTILOS DINÁMICOS DE ESTADO PARA MARCADORES */
        .route-idx-marker {
            background-color: #1e3a8a; /* Pendiente (Azul) */
            color: #ffffff; border: 2px solid #ffffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background-color 0.3s ease;
        }
        
        .route-idx-marker.estado-entregado {
            background-color: #10b981; /* Entregado (Verde) */
            opacity: 0.85; /* Un poco translúcido para que destaque menos */
        }
        
        .route-idx-marker.estado-error {
            background-color: #ef4444; /* Error (Rojo) */
        }

        .history-idx-marker {
            background-color: #dc2626; color: #ffffff; border: 2px solid #ffffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .map-picking-active { cursor: crosshair !important; }

        .nav-item { transition: all 0.2s ease; }
        .nav-item.active { color: #1e3a8a; }
        .dark .nav-item.active { color: #60a5fa; }
        
        #bottom-sheet { transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #printTableContainer { display: none; }

        @media print {
            #bottom-sheet, #bottom-nav, #toastMapPicker, .leaflet-control-zoom, #exitHistoryBtn { display: none !important; }
            #map-wrapper { height: 45vh !important; flex: none !important; position: relative !important; }
            #printTableContainer { display: block !important; width: 100% !important; margin-top: 20px; font-family: Arial, sans-serif; color: #000; }
            body { background: #fff !important; color: #000 !important; overflow: visible !important; display: block !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; border: 1px solid #ddd; padding: 8px; font-size: 12px; text-align: left; }
            td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full overflow-hidden bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 select-none">

    <div id="map-wrapper" class="flex-1 relative z-0 w-full">
        <div class="absolute top-0 left-0 right-0 h-28 bg-gradient-to-b from-black/50 to-transparent z-[400] pointer-events-none"></div>
        
        <div id="map" class="h-full w-full"></div>
        
        <div id="toastMapPicker" class="absolute top-12 left-1/2 transform -translate-x-1/2 z-[400] bg-blue-950 text-white px-4 py-2 rounded-full shadow-lg flex items-center space-x-2 opacity-0 transition-opacity duration-300 pointer-events-none">
            <span class="flex h-3 w-3 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
            <p class="text-xs font-semibold">Toca el mapa para situar tramo</p>
        </div>

        <button id="exitHistoryBtn" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-[400] bg-red-600 text-white font-bold px-4 py-2 rounded-xl shadow-2xl flex items-center space-x-2 border border-red-500 active:scale-95 transition-all hidden animate-bounce">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" /></svg>
            <span class="text-xs tracking-wider uppercase">Salir Histórico</span>
        </button>
    </div>

    <div id="bottom-sheet" class="bg-white dark:bg-gray-900 rounded-t-3xl shadow-[0_-15px_40px_rgba(0,0,0,0.15)] z-40 w-full flex flex-col border-t border-gray-200 dark:border-gray-800 h-[60dvh]">
        
        <div class="w-full flex justify-center pt-3 pb-2 shrink-0 cursor-pointer" onclick="switchTab('mapa')">
            <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full"></div>
        </div>

        <div id="view-ruta" class="tab-content flex-1 overflow-y-auto px-4 pb-4 space-y-4 hidden">
            <div class="grid grid-cols-3 gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl shrink-0">
                <button onclick="switchMunicipality('catarroja')" id="tab-catarroja" class="tab-btn py-2 text-xs font-bold rounded-lg transition-all bg-white dark:bg-gray-700 shadow-sm text-blue-900 dark:text-white">Catarroja</button>
                <button onclick="switchMunicipality('albal')" id="tab-albal" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-500 dark:text-gray-400">Albal</button>
                <button onclick="switchMunicipality('massanassa')" id="tab-massanassa" class="tab-btn py-2 text-xs font-semibold rounded-lg transition-all text-gray-500 dark:text-gray-400">Massanassa</button>
            </div>

            <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl border border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Añadir Tramos</span>
                    <button type="button" onclick="activateMapPickerMode()" class="text-[10px] bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-1 px-2 rounded flex items-center space-x-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></svg>
                        <span>En Mapa</span>
                    </button>
                </div>
                <form id="routeForm" onsubmit="handleFormSubmit(event)" class="space-y-2 relative">
                    <input type="hidden" id="customCoordsInput" value="">
                    <input type="text" id="streetInput" autocomplete="off" placeholder="Calle o Plaza" class="w-full px-3 py-2 text-sm bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-600 dark:text-white" required>
                    <div id="autocompleteList" class="absolute top-10 left-0 right-0 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl max-h-40 overflow-y-auto hidden z-50"></div>
                    
                    <div class="flex space-x-2">
                        <input type="text" id="portalInput" placeholder="Portal (Lotes: 21,25)" class="flex-1 px-3 py-2 text-sm bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-600 dark:text-white" required>
                        <button type="submit" id="submitBtn" class="bg-blue-900 hover:bg-blue-800 text-white font-bold px-4 py-2 rounded-lg shadow flex items-center justify-center shrink-0">

            <div>

                    <button onclick="invertirSentidoRutaCompleta()" class="flex-1 bg-purple-700 text-white font-bold py-2 rounded-lg shadow-sm text-xs active:scale-[0.98]">Invertir Marcha</button>

                    <button onclick="syncPendingCoordinates()" id="syncQueueBtn" class="hidden text-[10px] bg-amber-500 text-slate-950 font-bold px-2 py-1 rounded animate-pulse">Sincronizar</button>

        <div id="view-historial" class="tab-content flex-1 overflow-y-auto px-4 pb-4 space-y-4 hidden">
            <button onclick="archiveCurrentJob()" class="w-full bg-emerald-600 text-white text-xs font-bold py-3 rounded-xl shadow mt-2">Archivar Jornada Actual</button>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Histórico Guardado</label>

        </div>

        <div id="view-ajustes" class="tab-content flex-1 overflow-y-auto px-4 pb-4 space-y-5 hidden">
            <div class="mt-2">
                <button onclick="ejecutarImpresionJornada()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md text-xs flex justify-center items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.82l-.24 2.11A1.23 1.23 0 007.71 17.3h8.58a1.23 1.23 0 001.23-1.37l-.24-2.11M6.72 13.82a3.68 3.33 0 0110.56 0M6.72 13.82H4.47a1.23 1.23 0 00-1.23 1.23v2.45a1.23 1.23 0 001.23 1.23h1.23M17.28 13.82h2.25a1.23 1.23 0 011.23 1.23v2.45a1.23 1.23 0 01-1.23 1.23h-1.23M16.5 6.75H7.5v4.5h9v-4.5z" /></svg>
                    <span>Imprimir Hoja de Ruta</span>
                </button>
            </div>

            <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl border border-gray-200 dark:border-gray-700 space-y-3">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Datos Offline (Sin Cobertura)</label>
                
                <div class="flex justify-between items-center">
                    <span class="text-xs font-medium dark:text-gray-300">Textos (Calles y Plazas)</span>
                    <span id="dbSizeBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-gray-200 dark:bg-gray-700">Vacío</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="downloadCallejeroOverpass()" class="text-xs bg-blue-900 text-white py-2 rounded-lg font-semibold">Bajar Datos</button>
                    <button onclick="clearCallejeroLocal()" class="text-xs bg-gray-200 dark:bg-gray-700 text-red-600 py-2 rounded-lg font-semibold">Borrar</button>
                </div>

                <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
                    <span class="text-xs font-medium dark:text-gray-300 block mb-2">Imágenes Cartográficas (Área visible)</span>
                    <button onclick="downloadMapTilesOffline()" id="btnDownloadMap" class="w-full text-xs bg-teal-700 text-white py-2 rounded-lg font-semibold">Descargar Plano Nivel 14-17</button>
                </div>
            </div>

            <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl border border-gray-200 dark:border-gray-700 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold dark:text-gray-300">Modo Noche (Mapa y UI)</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="nightModeToggle" onchange="toggleNightMode()" class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
                
                <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
                    <span class="text-xs font-semibold dark:text-gray-300 block mb-2">Copias de Seguridad (JSON)</span>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="triggerBackup()" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 py-2 rounded-lg font-bold">Exportar</button>
                        <button onclick="triggerRestore()" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 py-2 rounded-lg font-bold">Importar</button>
                    </div>

                    <button onclick="checkUpdateOTA()" class="w-full bg-gray-900 dark:bg-gray-950 text-white text-[11px] font-mono py-2 rounded-lg flex items-center justify-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                        <span>Comprobar OTA (v6.6.0)</span>
                    </button>

            </div>
        </div>

    <nav id="bottom-nav" class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 z-50 shrink-0 flex justify-around items-center px-2 pt-2.5 pb-[max(env(safe-area-inset-bottom),0.75rem)]">
        <button onclick="switchTab('mapa')" id="nav-mapa" class="nav-item active flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
            <span class="text-[11px] font-semibold">Mapa</span>
        </button>
        <button onclick="switchTab('ruta')" id="nav-ruta" class="nav-item flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span class="text-[11px] font-semibold">Ruta</span>
        </button>
        <button onclick="switchTab('historial')" id="nav-historial" class="nav-item flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[11px] font-semibold">Historial</span>
        </button>
        <button onclick="switchTab('ajustes')" id="nav-ajustes" class="nav-item flex flex-col items-center justify-center w-full text-gray-500 dark:text-gray-400">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="text-[11px] font-semibold">Ajustes</span>
        </button>
    </nav>

    <div id="printTableContainer">
        <h2 style="font-size: 20px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 5px;">AmailIA - Hoja de Ruta</h2>
        <div style="font-size: 11px; margin-bottom: 15px;" id="printMetaLabel"></div>
        <table>
            <thead><tr><th style="width: 8%; text-align: center;">Ord.</th><th style="width: 20%;">Municipio</th><th style="width: 60%;">Dirección / Calle</th><th style="width: 12%; text-align: center;">Portal</th></tr></thead>
            <tbody id="printTableBody"></tbody>
        </table>
    </div>

    <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="handleImportFile(event)">

    <script>
        const APP_VERSION = "6.6.0";
        const MUNICIPALITIES = {
            catarroja: { name: "Catarroja", cp: "46470", coords: [39.4031, -0.4024] },
            albal: { name: "Albal", cp: "46470", coords: [39.3958, -0.4154] },
            massanassa: { name: "Massanassa", cp: "46460", coords: [39.4125, -0.3997] }
        };

        let currentMunicipality = 'catarroja';
        let map = null, mapTileLayer;
        let activeRouteData = []; 
        let routeMarkersGroup, routeLinesGroup, historyLayersGroup;
        let isMapPickingModeActive = false;

        /* --- UI LOGIC: Pestañas y Bottom Sheet --- */
        function switchTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tabId}`).classList.add('active');

            const sheet = document.getElementById('bottom-sheet');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));

            if (tabId === 'mapa') {
                sheet.style.height = '0px'; 
            } else {
                sheet.style.height = '60dvh'; 
                document.getElementById(`view-${tabId}`).classList.remove('hidden');
            }

            setTimeout(() => { if(map) map.invalidateSize(); }, 350);
        }

        /* --- MAP CACHE SYSTEM (L.TileLayer.Cached) --- */
        L.TileLayer.Cached = L.TileLayer.extend({
            createTile: function (coords, done) {
                var tile = document.createElement('img');
                var url = this.getTileUrl(coords);
                tile.alt = '';
                if ('caches' in window) {
                    caches.match(url).then(function(response) {
                        if (response) { response.blob().then(function(blob) { tile.src = URL.createObjectURL(blob); done(null, tile); }); } 
                        else {
                            fetch(url).then(res => {
                                let resClone = res.clone();
                                caches.open('amailia-maptiles').then(cache => cache.put(url, resClone));
                                res.blob().then(blob => { tile.src = URL.createObjectURL(blob); done(null, tile); });
                            }).catch(err => { done(err, tile); });
                        }
                    });
                } else { tile.src = url; done(null, tile); }
                return tile;
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            initLeafletMap();
            loadStateFromLocalStorage();
            renderActiveRoute();
            renderHistoryFileList();
            updateCallejeroStatusUI();
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.getElementById('nightModeToggle').checked = true; toggleNightMode();
            }
            switchTab('ruta');
        });

        function initLeafletMap() {
            const initConf = MUNICIPALITIES[currentMunicipality];
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(initConf.coords, 15);
            mapTileLayer = new L.TileLayer.Cached('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            
            routeMarkersGroup = L.layerGroup().addTo(map);
            routeLinesGroup = L.layerGroup().addTo(map);
            historyLayersGroup = L.layerGroup().addTo(map);

            map.on('click', function(e) { if (isMapPickingModeActive) handleMapClickCapture(e.latlng); });
        }

        /* --- LÓGICA CORE: Tramos, Formularios, TSP --- */
        function switchMunicipality(muniKey) {
            currentMunicipality = muniKey;
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.remove("bg-white", "dark:bg-gray-700", "shadow-sm", "text-blue-900", "dark:text-white");
                btn.classList.add("text-gray-500", "dark:text-gray-400");
            });
            document.getElementById(`tab-${muniKey}`).classList.add("bg-white", "dark:bg-gray-700", "shadow-sm", "text-blue-900", "dark:text-white");
            map.flyTo(MUNICIPALITIES[muniKey].coords, 15, { animate: true, duration: 1 });
            updateCallejeroStatusUI();
        }

        function activateMapPickerMode() {
            isMapPickingModeActive = true; 
            switchTab('mapa'); 
            document.getElementById("map").classList.add("map-picking-active");
            document.getElementById("toastMapPicker").classList.replace("opacity-0", "opacity-100");
        }

        function handleMapClickCapture(latlng) {
            isMapPickingModeActive = false; 
            document.getElementById("map").classList.remove("map-picking-active");
            document.getElementById("toastMapPicker").classList.replace("opacity-100", "opacity-0");
            document.getElementById("customCoordsInput").value = JSON.stringify([latlng.lat, latlng.lng]);
            document.getElementById("streetInput").value = "Punto marcado en Mapa";
            switchTab('ruta'); 
            document.getElementById("portalInput").focus();
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            const streetName = document.getElementById("streetInput").value.trim();
            const portalesLote = document.getElementById("portalInput").value.split(',').map(p => p.trim()).filter(p => p !== "");
            const customCoordsRaw = document.getElementById("customCoordsInput").value;
            submitBtn.disabled = true;

            for (let portalToken of portalesLote) {
                const portalNum = parseInt(portalToken, 10);
                if (isNaN(portalNum)) continue;
                let geoPoint = null; let isPendingSync = false;

                if (customCoordsRaw) { geoPoint = JSON.parse(customCoordsRaw); } 
                else if (navigator.onLine) {
                    try {
                        const mName = MUNICIPALITIES[currentMunicipality].name;
                        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(streetName)}+${portalNum},+${mName},+Valencia&limit=1`);
                        const data = await res.json();
                        if (data && data.length > 0) geoPoint = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    } catch (err) {}
                }
                if (!geoPoint) { isPendingSync = true; geoPoint = [...MUNICIPALITIES[currentMunicipality].coords]; }
                
                // Novedad v6.6.0: Añadimos la propiedad de estado (pendiente por defecto)
                activeRouteData.push({ 
                    id: Date.now() + Math.random(), 
                    municipality: currentMunicipality, 
                    street: streetName, 
                    portal: portalNum, 
                    coords: geoPoint, 
                    pendingSync: isPendingSync,
                    estado: 'pendiente' // 'pendiente', 'entregado', 'error'
                });
            }

            saveStateToLocalStorage(); renderActiveRoute();
            document.getElementById("routeForm").reset(); document.getElementById("customCoordsInput").value = "";
            submitBtn.disabled = false; syncPendingCoordinates();
        }

        /* Novedad v6.6.0: Función global para cambiar el estado de un tramo desde el popup o la lista */
        window.cambiarEstadoTramo = function(id, nuevoEstado) {
            const tramo = activeRouteData.find(s => s.id === id);
            if (tramo) {
                tramo.estado = tramo.estado === nuevoEstado ? 'pendiente' : nuevoEstado;
                saveStateToLocalStorage();
                renderActiveRoute();
                // Opcional: Cerrar popup tras pulsar
                map.closePopup();
            }
        };

        function renderActiveRoute() {
            routeMarkersGroup.clearLayers(); routeLinesGroup.clearLayers();
            const listContainer = document.getElementById("liveRouteList"); listContainer.innerHTML = "";
            document.getElementById("routeCountBadge").textContent = activeRouteData.length;

            if (activeRouteData.length === 0) { listContainer.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-2">Ruta vacía.</p>`; document.getElementById("syncQueueBtn").classList.add("hidden"); return; }

            const polylinePoints = []; let pendingSyncCount = 0;
            activeRouteData.forEach((segment, index) => {
                const step = index + 1;
                if (segment.pendingSync) pendingSyncCount++; else polylinePoints.push(segment.coords);

                // Asignación dinámica de clases CSS según el estado del tramo
                let estadoClassMarker = '';
                let estadoIconLista = '';
                if (segment.estado === 'entregado') {
                    estadoClassMarker = 'estado-entregado';
                    estadoIconLista = '<span class="text-green-500 font-bold ml-1">✓</span>';
                } else if (segment.estado === 'error') {
                    estadoClassMarker = 'estado-error';
                    estadoIconLista = '<span class="text-red-500 font-bold ml-1">✗</span>';
                }

                if (!segment.pendingSync) {
                    const customIcon = L.divIcon({ 
                        className: `route-idx-marker ${estadoClassMarker}`, 
                        html: `<span>${step}</span>`, 
                        iconSize: [28, 28], 
                        iconAnchor: [14, 14] 
                    });

                    // Construcción del Popup interactivo con botones de estado
                    const popupContent = `
                        <div style="font-family: sans-serif; text-align: center;">
                            <b>Tramo #${step}</b><br>${segment.street}, Nº${segment.portal}
                            <div style="margin-top: 8px; display: flex; gap: 4px; justify-content: center;">
                                <button onclick="cambiarEstadoTramo(${segment.id}, 'entregado')" style="background: #10b981; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">✓ Entregado</button>
                                <button onclick="cambiarEstadoTramo(${segment.id}, 'error')" style="background: #ef4444; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">✗ Error</button>
                            </div>
                        </div>
                    `;

                    L.marker(segment.coords, { icon: customIcon }).bindPopup(popupContent).addTo(routeMarkersGroup);
                }

                // Renderizado en la lista del panel
                let borderLeftClass = segment.pendingSync ? 'border-amber-500' : 'border-blue-700';
                if (segment.estado === 'entregado') borderLeftClass = 'border-green-500 opacity-60'; // Atenuar un poco si ya está entregado
                if (segment.estado === 'error') borderLeftClass = 'border-red-500';

                const row = document.createElement("div"); 
                row.className = `flex justify-between items-center p-2 bg-white dark:bg-gray-900 rounded-lg border-l-4 ${borderLeftClass} mb-1.5 shadow-sm`;
                row.innerHTML = `
                    <div class="text-xs truncate flex items-center space-x-2">
                        <button onclick="solicitarCambioPosicionDirecto(${index})" class="bg-blue-100 dark:bg-blue-900 text-blue-900 dark:text-blue-200 font-bold px-2 py-0.5 rounded">${step}</button>
                        <div class="truncate">
                            <p class="font-bold dark:text-gray-200">${segment.street} ${estadoIconLista}</p>
                            <p class="text-[10px] text-gray-500">Nº${segment.portal}</p>
                        </div>
                    </div>
                    <button onclick="removeSegment(${segment.id})" class="text-red-400 p-1">x</button>
                `;
                listContainer.appendChild(row);
            });

            const syncBtn = document.getElementById("syncQueueBtn");
            if (pendingSyncCount > 0) { syncBtn.classList.remove("hidden"); syncBtn.textContent = `Sync (${pendingSyncCount})`; } else { syncBtn.classList.add("hidden"); }
            if (polylinePoints.length > 1) L.polyline(polylinePoints, { color: '#1e3a8a', weight: 4, opacity: 0.8, dashArray: '6, 10' }).addTo(routeLinesGroup);
        }

        function solicitarCambioPosicionDirecto(indexActual) {
            const nuevaPos = prompt(`Mover tramo ${indexActual + 1} de ${activeRouteData.length} a la posición:`);
            if(!nuevaPos) return; const np = parseInt(nuevaPos, 10);
            if(isNaN(np) || np < 1 || np > activeRouteData.length) return alert("Posición inválida");
            const item = activeRouteData.splice(indexActual, 1)[0];
            activeRouteData.splice(np - 1, 0, item);
            saveStateToLocalStorage(); renderActiveRoute();
        }

        async function syncPendingCoordinates() {
            if (!navigator.onLine) return; let changed = false;
            for (let segment of activeRouteData) {
                if (segment.pendingSync) {
                    try {
                        const mName = MUNICIPALITIES[segment.municipality].name;
                        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(segment.street)}+${segment.portal},+${mName},+Valencia&limit=1`);
                        const data = await res.json();
                        if (data && data.length > 0) { segment.coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)]; segment.pendingSync = false; changed = true; }
                    } catch (err) {}
                }
            }
            if (changed) { saveStateToLocalStorage(); renderActiveRoute(); }
        }

        function removeSegment(id) { activeRouteData = activeRouteData.filter(s => s.id !== id); saveStateToLocalStorage(); renderActiveRoute(); }
        function invertirSentidoRutaCompleta() { activeRouteData.reverse(); saveStateToLocalStorage(); renderActiveRoute(); }

        /* ALGORITMO TSP (Haversine) */
        function calculateHaversineDistance(c1, c2) {
            const R = 6371e3; const lat1 = c1[0] * Math.PI / 180; const lat2 = c2[0] * Math.PI / 180;
            const a = Math.sin((c2[0] - c1[0]) * Math.PI / 180 / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin((c2[1] - c1[1]) * Math.PI / 180 / 2) ** 2;
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))); 
        }
        function optimizeRouteLocalTSP() {
            const valid = activeRouteData.filter(s => !s.pendingSync);
            if (valid.length < 2) return alert("Introduce 2 tramos sincronizados.");
            let callesMap = {}; valid.forEach(t => { let k = t.street.trim().toLowerCase(); if (!callesMap[k]) callesMap[k] = []; callesMap[k].push(t); });
            for (let c in callesMap) callesMap[c].sort((a, b) => a.portal - b.portal);
            let restantes = Object.keys(callesMap); let ruta = [];
            let key = restantes.shift(); let lista = callesMap[key]; ruta = ruta.concat(lista);
            let ult = lista[lista.length - 1];
            while (restantes.length > 0) {
                let idx = 0, minD = Infinity, normal = true;
                for (let i = 0; i < restantes.length; i++) {
                    let cand = callesMap[restantes[i]];
                    let dIni = calculateHaversineDistance(ult.coords, cand[0].coords);
                    let dFin = calculateHaversineDistance(ult.coords, cand[cand.length - 1].coords);
                    if (dIni < minD) { minD = dIni; idx = i; normal = true; }
                    if (dFin < minD) { minD = dFin; idx = i; normal = false; }
                }
                let kProx = restantes.splice(idx, 1)[0]; let blq = callesMap[kProx];
                if (!normal) blq.reverse();
                ruta = ruta.concat(blq); ult = blq[blq.length - 1];
            }
            activeRouteData = [...ruta, ...activeRouteData.filter(s => s.pendingSync)];
            saveStateToLocalStorage(); renderActiveRoute(); map.fitBounds(ruta.map(s => s.coords), { padding: [40, 40] }); switchTab('mapa');
        }

        /* --- HISTORIAL Y ARCHIVADO --- */
        function archiveCurrentJob() {
            if (activeRouteData.length === 0) return alert("Sin datos.");
            let h = JSON.parse(localStorage.getItem("amailia_history") || "[]");
            h.push({ date: new Date().toISOString(), data: activeRouteData });
            localStorage.setItem("amailia_history", JSON.stringify(h));
            activeRouteData = []; saveStateToLocalStorage(); renderActiveRoute(); renderHistoryFileList();
            alert("Guardado.");
        }
        function renderHistoryFileList() {
            const container = document.getElementById("historyFilesContainer"); container.innerHTML = "";
            const h = JSON.parse(localStorage.getItem("amailia_history") || "[]");
            if (h.length === 0) { container.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">No hay rutas archivadas.</p>`; return; }
            h.slice().reverse().forEach((job, revIdx) => {
                const idx = h.length - 1 - revIdx; const d = new Date(job.date);
                const div = document.createElement("div"); div.className = "flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700";
                div.innerHTML = `<div class="text-xs cursor-pointer flex-1" onclick="viewHistoryOnMap(${idx})"><p class="font-bold dark:text-white">📅 ${d.toLocaleDateString()}</p><p class="text-[10px] text-gray-500">${job.data.length} tramos • ${d.toLocaleTimeString()}</p></div><button onclick="deleteHistoryJob(${idx})" class="text-red-400 px-2">x</button>`;
                container.appendChild(div);
            });
        }
        function viewHistoryOnMap(index) {
            const job = JSON.parse(localStorage.getItem("amailia_history"))[index]; if(!job) return;
            switchTab('mapa'); historyLayersGroup.clearLayers();
            map.removeLayer(routeMarkersGroup); map.removeLayer(routeLinesGroup);
            let pts = [];
            job.data.filter(s=>s.coords).forEach((s, i) => {
                pts.push(s.coords);
                L.marker(s.coords, { icon: L.divIcon({ className: 'history-idx-marker', html: `<span>${i+1}</span>`, iconSize: [26, 26] }) }).addTo(historyLayersGroup);
            });
            if(pts.length>1) L.polyline(pts, {color: '#dc2626', weight:4}).addTo(historyLayersGroup);
            if(pts.length>0) map.fitBounds(L.polyline(pts).getBounds(), {padding:[50,50]});
            document.getElementById("exitHistoryBtn").classList.remove("hidden");
        }
        document.getElementById("exitHistoryBtn").addEventListener("click", () => {
            historyLayersGroup.clearLayers(); map.addLayer(routeMarkersGroup); map.addLayer(routeLinesGroup);
            document.getElementById("exitHistoryBtn").classList.add("hidden"); switchTab('historial');
        });
        function deleteHistoryJob(idx) { if(!confirm("¿Borrar?")) return; let h = JSON.parse(localStorage.getItem("amailia_history")); h.splice(idx,1); localStorage.setItem("amailia_history", JSON.stringify(h)); renderHistoryFileList(); }

        /* --- OFFLINE, BACKUP E IMPRESIÓN --- */
        async function downloadMapTilesOffline() {
            if (!('caches' in window)) return alert("Cache API no soportada.");
            if (!navigator.onLine) return alert("Conecta a internet primero.");
            const bounds = map.getBounds(); const btn = document.getElementById("btnDownloadMap");
            const orig = btn.innerText; btn.innerText = "Calculando..."; btn.disabled = true;
            const lon2tile = (lon, z) => (Math.floor((lon + 180) / 360 * Math.pow(2, z)));
            const lat2tile = (lat, z) => (Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z)));
            let urls = [];
            [14, 15, 16, 17].forEach(z => {
                for (let x = lon2tile(bounds.getWest(), z); x <= lon2tile(bounds.getEast(), z); x++) {
                    for (let y = lat2tile(bounds.getNorth(), z); y <= lat2tile(bounds.getSouth(), z); y++) {
                        urls.push(`https://${['a','b','c'][Math.floor(Math.random()*3)]}.tile.openstreetmap.org/${z}/${x}/${y}.png`);
                    }
                }
            });
            if(urls.length > 500 && !confirm(`¿Descargar ${urls.length} teselas?`)) { btn.innerText = orig; btn.disabled = false; return; }
            btn.innerText = `0/${urls.length}`; let c = 0;
            try {
                const cache = await caches.open('amailia-maptiles');
                for (let i = 0; i < urls.length; i += 10) {
                    await Promise.all(urls.slice(i, i+10).map(async u => {
                        try { const res = await fetch(u, {mode:'cors'}); if(res.ok) await cache.put(u, res); } catch(e){} c++;
                    }));
                    btn.innerText = `${c}/${urls.length}`;
                }
                btn.innerText = "¡Listo!"; setTimeout(() => btn.innerText = orig, 3000);
            } catch(e) { alert("Error"); btn.innerText = orig; }
            btn.disabled = false;
        }

        async function downloadCallejeroOverpass() {
            try {
                const q = `[out:json];area["name"="${MUNICIPALITIES[currentMunicipality].name}"]["admin_level"="8"]->.searchArea;(nwr["highway"~"residential|unclassified|pedestrian|living_street|service|tertiary|secondary|primary"](area.searchArea);nwr["place"~"square|neighbourhood"](area.searchArea););out tags;`;
                const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
                const data = await res.json(); const vias = new Set();
                data.elements.forEach(el => { if (el.tags && el.tags.name) vias.add(el.tags.name.trim()); });
                localStorage.setItem(`amailia_db_vias_${currentMunicipality}`, JSON.stringify(Array.from(vias).sort()));
                updateCallejeroStatusUI(); alert("Calles guardadas.");
            } catch (err) { alert("Error al bajar calles."); }
        }
        function clearCallejeroLocal() { localStorage.removeItem(`amailia_db_vias_${currentMunicipality}`); updateCallejeroStatusUI(); }
        function updateCallejeroStatusUI() {
            const data = localStorage.getItem(`amailia_db_vias_${currentMunicipality}`);
            const b = document.getElementById("dbSizeBadge");
            if(data) { b.textContent = `${JSON.parse(data).length} calles`; b.className = "text-[10px] px-2 py-0.5 rounded bg-green-600 text-white"; }
            else { b.textContent = "Vacío"; b.className = "text-[10px] px-2 py-0.5 rounded bg-red-600 text-white"; }
        }
        document.getElementById("streetInput").addEventListener("input", (e) => {
            const q = e.target.value.toLowerCase(); const list = document.getElementById("autocompleteList");
            if(q.length < 3) return list.classList.add("hidden");
            const data = localStorage.getItem(`amailia_db_vias_${currentMunicipality}`); if(!data) return;
            const calles = JSON.parse(data).filter(c => c.toLowerCase().includes(q)).slice(0, 5);
            list.innerHTML = "";
            calles.forEach(c => {
                const div = document.createElement("div"); div.className = "px-3 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer dark:text-gray-200 border-b border-gray-100 dark:border-gray-700";
                div.innerText = c; div.onclick = () => { document.getElementById("streetInput").value = c; list.classList.add("hidden"); document.getElementById("portalInput").focus(); };
                list.appendChild(div);
            });
            calles.length > 0 ? list.classList.remove("hidden") : list.classList.add("hidden");
        });

        function ejecutarImpresionJornada() {
            if (activeRouteData.length === 0) return alert("Sin datos.");
            document.getElementById("printMetaLabel").textContent = `Fecha: ${new Date().toLocaleDateString('es-ES')} | Tramos: ${activeRouteData.length}`;
            const tbody = document.getElementById("printTableBody"); tbody.innerHTML = "";
            activeRouteData.forEach((s, i) => {
                let estadoTxt = '';
                if(s.estado === 'entregado') estadoTxt = '✅';
                if(s.estado === 'error') estadoTxt = '❌';

                const tr = document.createElement("tr");
                tr.innerHTML = `<td style="text-align: center; font-weight: bold;">${i + 1}</td><td>${MUNICIPALITIES[s.municipality].name}</td><td style="font-weight: bold;">${s.street}</td><td style="text-align: center; font-weight: bold;">${s.portal}</td><td style="text-align: center;">${estadoTxt}</td>`;
                tbody.appendChild(tr);
            });
            setTimeout(() => window.print(), 350);
        }

        function triggerBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ activeRoute: activeRouteData, history: JSON.parse(localStorage.getItem("amailia_history") || "[]") }));
            const a = document.createElement('a'); a.href = dataStr; a.download = `amailia_v${APP_VERSION}_backup.json`; a.click();
        }
        function triggerRestore() { document.getElementById("importFileInput").click(); }
        function handleImportFile(e) {
            const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const d = JSON.parse(e.target.result);
                    if (d.activeRoute && d.history) { activeRouteData = d.activeRoute; localStorage.setItem("amailia_history", JSON.stringify(d.history)); saveStateToLocalStorage(); renderActiveRoute(); renderHistoryFileList(); alert("Backup cargado."); }
                } catch(err) { alert("Error JSON."); }
            }; reader.readAsText(file);
        }
        async function checkUpdateOTA() {
            try {
                const res = await fetch(`${window.location.href.split('?')[0]}?cb=${Date.now()}`, { method: 'HEAD' });
                const sig = res.headers.get("ETag") || res.headers.get("Last-Modified");
                const local = localStorage.getItem("amailia_ota");
                if (local && local !== sig) { if (confirm("¿Actualizar?")) { localStorage.setItem("amailia_ota", sig); window.location.reload(true); } } 
                else { localStorage.setItem("amailia_ota", sig); alert(`Actualizado (v${APP_VERSION})`); }
            } catch (e) { console.log("OTA local."); }
        }

        function toggleNightMode() { const isDark = document.getElementById("nightModeToggle").checked; document.documentElement.classList.toggle("dark", isDark); }
        function saveStateToLocalStorage() { localStorage.setItem("amailia_active_route", JSON.stringify(activeRouteData)); localStorage.setItem("amailia_current_muni", currentMunicipality); }
        function loadStateFromLocalStorage() { const r = localStorage.getItem("amailia_active_route"); const m = localStorage.getItem("amailia_current_muni"); if(r) activeRouteData = JSON.parse(r); if(m) switchMunicipality(m); }
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AmailIA - Sistema unificado</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121824;
            --bg-card: #1c2333;
            --bg-input: #252d3f;
            --accent-orange: #f59e0b;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
        }

        /* Contenedor principal adaptativo */
        .phone-container {
            width: 100%;
            max-width: 390px;
            height: 100dvh; 
            background-color: var(--bg-main);
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 400px) {
            .phone-container {
                height: 844px;
                border-radius: 32px;
                border: 8px solid #000;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            }
        }

        /* Layout dividido */
        .main-layout {
            flex: 1;
            display: flex;
            position: relative;
            height: 100%;
        }

        .control-panel {
            width: 85%;
            height: 100%;
            background-color: var(--bg-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 2;
            box-shadow: 10px 0 20px rgba(0,0,0,0.4);
            overflow-y: auto;
        }

        .map-sidebar {
            width: 15%;
            height: 100%;
            background: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 0);
            background-size: 8px 8px;
            position: relative;
        }

        /* Cabecera */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .app-title-block h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-title-block span {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* Selectores de municipio */
        .terminos-container {
            display: flex;
            background-color: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        .termino-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .termino-btn.active {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-action-orange {
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Inputs y Formularios */
        .form-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .input-field {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            width: 100%;
            -webkit-appearance: none;
        }

        select.input-field {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }

        .row-inputs {
            display: flex;
            gap: 12px;
        }

        .btn-insertar {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Bloque de tramos ordenados */
        .reparto-diario-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 140px;
        }

        .tramos-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }

        .tramo-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .tramo-item .remove-btn {
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .no-tramos-msg {
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
        }

        .btn-finalizar {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }

        /* Controles flotantes barra derecha */
        .map-controls {
            position: absolute;
            bottom: 24px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
        }
        .map-btn {
            width: 40px;
            height: 40px;
            background-color: var(--bg-card);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        /* Panel Desplegable Ajustes */
        .ajustes-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background-color: var(--bg-card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 35px rgba(0,0,0,0.6);
            z-index: 10;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 1px solid var(--border-color);
        }

        .ajustes-panel.open {
            transform: translateY(0);
        }

        .ajustes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ajustes-row {
            background-color: var(--bg-main);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        /* Tarjeta de Estado Base de Datos */
        .status-box-download {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-box-header { display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .status-badge::before { content: ''; display: inline-block; width: 8px; height: 8px; background-color: currentColor; border-radius: 50%; }
        
        .size-badge {
            background-color: #1e293b;
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            font-weight: 700;
        }

        .status-box-body { font-size: 13px; color: var(--text-secondary); }
        .status-box-body strong { color: var(--text-primary); }

        .ajustes-actions-row { display: flex; gap: 12px; }
        .btn-ajuste { flex: 1; padding: 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
        .btn-ajuste-primary { background-color: var(--accent-blue); color: white; }
        .btn-ajuste-danger { background-color: #521b1b; color: #f87171; }
        
        .btn-ota { 
            background-color: var(--bg-main); 
            color: var(--text-secondary); 
            border: 1px solid var(--border-color); 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 12px; 
            cursor: pointer; 
            margin-top: auto; 
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="main-layout">
        
        <div class="control-panel">
            <div class="app-header">
                <div class="app-title-block">
                    <h1>AmailIA</h1>
                    <span>Ruta en Vivo</span>
                </div>
                <span class="material-icons" style="color: var(--text-secondary);">close</span>
            </div>

            <div>
                <p class="section-label">Término de Trabajo</p>
                <div class="terminos-container">
                    <button class="termino-btn active" onclick="ejecutarCambioTermino('Catarroja')">Catarroja</button>
                    <button class="termino-btn" onclick="ejecutarCambioTermino('Albal')">Albal</button>
                    <button class="termino-btn" onclick="ejecutarCambioTermino('Massanassa')">Massanassa</button>
                </div>
            </div>

            <button class="btn-action-orange">
                <span class="material-icons" style="font-size: 18px;">location_on</span>
                Marcar posición exacta con el dedo
            </button>

            <div class="form-group">
                <p class="section-label">Calle</p>
                <input type="text" class="input-field" id="ctx-input-calle" list="ctx-datalist-vias" placeholder="Escribe el nombre de la vía..." autocomplete="off">
                <datalist id="ctx-datalist-vias"></datalist>
            </div>

            <div class="row-inputs">
                <div class="form-group" style="flex: 1;">
                    <p class="section-label">Inicio</p>
                    <input type="text" id="ctx-input-portal" class="input-field" placeholder="Portal">
                </div>
                <div class="form-group" style="flex: 1;">
                    <p class="section-label">Acera</p>
                    <select id="ctx-select-acera" class="input-field">
                        <option value="Ambas aceras">Ambas aceras</option>
                        <option value="Pares">Pares</option>
                        <option value="Impares">Impares</option>
                    </select>
                </div>
            </div>

            <button class="btn-insertar" onclick="accionInsertarTramo()">
                <span class="material-icons" style="font-size: 18px;">add</span> Insertar en la Jornada
            </button>

            <div class="reparto-diario-block">
                <p class="section-label">Orden de Reparto Diario</p>
                <div id="ctx-render-tramos" class="tramos-lista"></div>
                <p id="ctx-fallback-vacio" class="no-tramos-msg">No hay tramos cargados en la jornada.</p>
            </div>

            <button class="btn-finalizar" onclick="accionArchivarJornada()">Finalizar y Archivar Jornada</button>
        </div>

        <div class="map-sidebar">
            <div class="map-controls">
                <div class="map-btn"><span class="material-icons" style="font-size: 20px;">map</span></div>
                <div class="map-btn" onclick="alternarDesplegableAjustes()"><span class="material-icons" style="font-size: 20px;">settings</span></div>
            </div>
        </div>

        <div class="ajustes-panel" id="ctx-modulo-ajustes">
            <div class="ajustes-header">
                <h2>Ajustes</h2>
                <span class="material-icons" style="cursor: pointer; font-size: 28px;" onclick="alternarDesplegableAjustes()">expand_more</span>
            </div>

            <div class="ajustes-row">
                <span>Filtro Visión Nocturna</span>
                <input type="checkbox" style="width: 18px; height: 18px; accent-color: var(--accent-blue);">
            </div>

            <div class="status-box-download" id="ctx-tarjeta-status">
                <div class="status-box-header">
                    <span class="status-badge" id="ctx-badge-titulo">SIN DATOS</span>
                    <span class="size-badge" id="ctx-badge-peso">0.0 KB</span>
                </div>
                <div class="status-box-body">
                    <p>término: <strong id="ctx-text-pueblo">Catarroja</strong></p>
                    <p id="ctx-text-detalles">vías en memoria local: Sin calles en memoria local.</p>
                </div>
            </div>

            <div class="ajustes-actions-row">
                <button class="btn-ajuste btn-ajuste-primary" onclick="motorDescargaOverpass()">Actualizar base</button>
                <button class="btn-ajuste btn-ajuste-danger" onclick="motorBorradoLocal()">Borrar datos</button>
            </div>

            <button class="btn-ota">Firmas HTTP OTA Versión</button>
        </div>

    </div>
</div>

<script>
    // Variables de entorno de la aplicación
    let estadoMunicipio = "Catarroja";
    let baseViasUrbana = [];
    let listadoTramosJornada = [];

    // Cambiar de municipio limpiando e inicializando estados locales
    function ejecutarCambioTermino(nombreMunicipio) {
        if (estadoMunicipio === nombreMunicipio) return;
        estadoMunicipio = nombreMunicipio;
        
        // Sincronizar UI de botones superiores
        document.querySelectorAll('.termino-btn').forEach(boton => {
            if (boton.textContent.trim() === nombreMunicipio) {
                boton.classList.add('active');
            } else {
                boton.classList.remove('active');
            }
        });

        // Limpieza de campos para evitar desbordamiento de tramos cruzados
        document.getElementById("ctx-input-calle").value = "";
        document.getElementById("ctx-input-portal").value = "";
        
        sincronizarNucleoLocal();
    }

    // Motor Asíncrono de consulta Overpass API para descarga municipal masiva
    async function motorDescargaOverpass() {
        renderUIStatusCard("DESCARGANDO...", "Conectando con servidores OpenStreetMap...", "0.0 KB", "#f59e0b", "#1e1b4b");

        const queryCompuesta = `[out:json][timeout:60];area["name"="${estadoMunicipio}"]["admin_level"=8]->.searchArea;(way["highway"~"residential|unclassified|pedestrian|living_street|service|tertiary|secondary|primary"](area.searchArea););out tags;`;
        const endpoint = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(queryCompuesta)}`;

        try {
            const peticion = await fetch(endpoint);
            if (!peticion.ok) throw new Error("Respuesta de pasarela inestable.");
            
            const cuerpo = await peticion.json();
            let setLimpieza = new Set();
            
            if (cuerpo.elements && cuerpo.elements.length > 0) {
                cuerpo.elements.forEach(el => {
                    if (el.tags && el.tags.name) {
                        setLimpieza.add(el.tags.name.trim());
                    }
                });
            }

            baseViasUrbana = Array.from(setLimpieza).sort((x, y) => x.localeCompare(y));
            
            if (baseViasUrbana.length === 0) {
                throw new Error("El término de búsqueda no contiene calles válidas catalogadas.");
            }

            // Almacenar bajo identificadores puros e inmunes a pisado de datos
            localStorage.setItem(`db_vias_${estadoMunicipio}`, JSON.stringify(baseViasUrbana));
            inyectarSugerenciasDatalist();
            
            const dimensionBytes = new Blob([JSON.stringify(baseViasUrbana)]).size;
            const dimensionKB = (dimensionBytes / 1024).toFixed(1);

            renderUIStatusCard("DESCARGADO CORRECTAMENTE", `${baseViasViasUrbana = baseViasUrbana.length} calles registradas.`, `${dimensionKB} KB`, "#10b981", "#064e3b");
            
        } catch (err) {
            console.error("Fallo crítico del motor:", err);
            renderUIStatusCard("ERROR EN DESCARGA", "Error al procesar el callejero.", "0.0 KB", "#ef4444", "#450a0a");
        }
    }

    // Sincronización y lectura de la persistencia local por término
    function sincronizarNucleoLocal() {
        document.getElementById("ctx-text-pueblo").textContent = estadoMunicipio;
        const dumpDatos = localStorage.getItem(`db_vias_${estadoMunicipio}`);
        
        if (dumpDatos) {
            baseViasUrbana = JSON.parse(dumpDatos);
            inyectarSugerenciasDatalist();
            const pesoKB = (new Blob([dumpDatos]).size / 1024).toFixed(1);
            renderUIStatusCard("DESCARGADO CORRECTAMENTE", `${baseViasUrbana.length} calles registradas.`, `${pesoKB} KB`, "#10b981", "#064e3b");
        } else {
            baseViasUrbana = [];
            inyectarSugerenciasDatalist();
            renderUIStatusCard("SIN DATOS", "Sin calles en memoria local.", "0.0 KB", "#f59e0b", "#451a03");
        }
    }

    // Rellenar dinámicamente las opciones del datalist para el input buscador
    function inyectarSugerenciasDatalist() {
        const datalist = document.getElementById("ctx-datalist-vias");
        datalist.innerHTML = "";
        baseViasUrbana.forEach(via => {
            const itemElement = document.createElement("option");
            itemElement.value = via;
            datalist.appendChild(itemElement);
        });
    }

    // Insertar tramo de reparto en la vista diaria
    function accionInsertarTramo() {
        const inputCalle = document.getElementById("ctx-input-calle");
        const inputPortal = document.getElementById("ctx-input-portal");
        const selectAcera = document.getElementById("ctx-select-acera");

        if (!inputCalle.value.trim()) {
            alert("Selecciona o escribe una calle válida de la lista.");
            return;
        }

        const modeloTramo = {
            idUnico: Date.now(),
            calle: inputCalle.value.trim(),
            portal: inputPortal.value.trim() || 'S/N',
            acera: selectAcera.value
        };

        listadoTramosJornada.push(modeloTramo);
        
        // Limpiar inputs dejando listos para la siguiente inserción rápida
        inputCalle.value = "";
        inputPortal.value = "";

        refrescarLayoutListaReparto();
    }

    function borrarTramoEspecifico(idTramo) {
        listadoTramosJornada = listadoTramosJornada.filter(tramo => tramo.idUnico !== idTramo);
        refrescarLayoutListaReparto();
    }

    // Pintar los elementos en el contenedor del reparto diario
    function refrescarLayoutListaReparto() {
        const cajaRender = document.getElementById("ctx-render-tramos");
        const elementoVacio = document.getElementById("ctx-fallback-vacio");
        
        cajaRender.innerHTML = "";

        if (listadoTramosJornada.length === 0) {
            elementoVacio.style.display = "block";
            return;
        }

        elementoVacio.style.display = "none";
        listadoTramosJornada.forEach((tramo, indice) => {
            const nodoHtml = document.createElement("div");
            nodoHtml.className = "tramo-item";
            nodoHtml.innerHTML = `
                <div>
                    <strong>${indice + 1}. ${tramo.calle}</strong> - Portal ${tramo.portal} (${tramo.acera})
                </div>
                <span class="remove-btn" onclick="borrarTramoEspecifico(${tramo.idUnico})">×</span>
            `;
            cajaRender.appendChild(nodoHtml);
        });
    }

    function accionArchivarJornada() {
        if (listadoTramosJornada.length === 0) {
            alert("No hay ningún elemento cargado en la jornada de hoy.");
            return;
        }
        alert(`Jornada guardada con éxito. Archivados ${listadoTramosJornada.length} tramos.`);
        listadoTramosJornada = [];
        refrescarLayoutListaReparto();
    }

    function motorBorradoLocal() {
        localStorage.removeItem(`db_vias_${estadoMunicipio}`);
        baseViasUrbana = [];
        inyectarSugerenciasDatalist();
        renderUIStatusCard("DATOS BORRADOS", "0 calles registradas.", "0.0 KB", "#ef4444", "#450a0a");
    }

    // Control visual de la tarjeta de sincronización de datos
    function renderUIStatusCard(titulo, subtexto, peso, colorHex, colorFondoBadge) {
        const badge = document.getElementById("ctx-badge-titulo");
        const badgePeso = document.getElementById("ctx-badge-peso");
        const contenedor = document.getElementById("ctx-tarjeta-status");
        
        badge.textContent = titulo;
        badge.style.color = colorHex;
        
        badgePeso.textContent = peso;
        badgePeso.style.color = colorHex;
        badgePeso.style.backgroundColor = colorFondoBadge;
        
        document.getElementById("ctx-text-detalles").textContent = `vías en memoria local: ${subtexto}`;
        contenedor.style.borderColor = colorHex;
    }

    function alternarDesplegableAjustes() {
        document.getElementById("ctx-modulo-ajustes").classList.toggle("open");
    }

    // Inicializar ciclo de vida de la vista
    document.addEventListener("DOMContentLoaded", sincronizarNucleoLocal);
</script>
</body>
</html>
